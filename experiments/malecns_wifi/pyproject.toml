[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "malecns-wifi-experiment"
version = "0.1.0"
description = "Compile MaleCNS v1.0 and test it as a fixed sparse reservoir for Wi-Fi sensing experiments."
requires-python = ">=3.11"
dependencies = [
  "numpy>=2",
  "pyarrow>=18",
  "scipy>=1.14",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/malecns_wifi"]
