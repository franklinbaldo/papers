name: Pontifex CMB sensitivity landscape

on:
  pull_request:
    paths:
      - "experiments/pontifex_torus/cmb_sensitivity_landscape.py"
      - "experiments/pontifex_torus/cmb_sensitivity.py"
      - "experiments/pontifex_torus/cmb_occlusion_mc.py"
      - ".github/workflows/pontifex-cmb-sensitivity-landscape.yml"
  workflow_dispatch:
    inputs:
      samples:
        description: "Theta samples per configuration"
        required: false
        default: "220"
      null_maps:
        description: "Matched-theta null maps"
        required: false
        default: "6"
      null_repeats:
        description: "Null repeats for threshold"
        required: false
        default: "12"

jobs:
  landscape:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Run sensitivity landscape
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            uv run experiments/pontifex_torus/cmb_sensitivity_landscape.py \
              --amplitudes 0 0.03 0.1 0.3 \
              --families canonical warped \
              --seeds 0 1 \
              --samples 90 \
              --null-maps 4 \
              --null-repeats 5 \
              --top-configs 12 \
              --ny 72 \
              --nx 144 \
              --output /tmp/pontifex-cmb-sensitivity-landscape.json \
              --rows /tmp/pontifex-cmb-sensitivity-landscape.csv \
              --plot /tmp/pontifex-cmb-sensitivity-landscape.png
          else
            uv run experiments/pontifex_torus/cmb_sensitivity_landscape.py \
              --amplitudes 0 0.003 0.01 0.03 0.1 0.3 \
              --families canonical warped offmodel \
              --seeds 0 1 2 3 4 \
              --samples "${{ github.event.inputs.samples || '220' }}" \
              --null-maps "${{ github.event.inputs.null_maps || '6' }}" \
              --null-repeats "${{ github.event.inputs.null_repeats || '12' }}" \
              --top-configs 20 \
              --output /tmp/pontifex-cmb-sensitivity-landscape.json \
              --rows /tmp/pontifex-cmb-sensitivity-landscape.csv \
              --plot /tmp/pontifex-cmb-sensitivity-landscape.png
          fi

      - name: Summarize
        if: always()
        run: |
          if [ -f /tmp/pontifex-cmb-sensitivity-landscape.json ]; then
            echo "## CMB sensitivity landscape" >> "$GITHUB_STEP_SUMMARY"
            echo '~~~json' >> "$GITHUB_STEP_SUMMARY"
            python -c 'import json; x=json.load(open("/tmp/pontifex-cmb-sensitivity-landscape.json")); print(json.dumps({"configs_tested":x["configs_tested"],"top_configurations":x["top_configurations"][:12]}, indent=2))' >> "$GITHUB_STEP_SUMMARY"
            echo '~~~' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pontifex-cmb-sensitivity-landscape
          path: |
            /tmp/pontifex-cmb-sensitivity-landscape.json
            /tmp/pontifex-cmb-sensitivity-landscape.csv
            /tmp/pontifex-cmb-sensitivity-landscape.png
          if-no-files-found: warn
