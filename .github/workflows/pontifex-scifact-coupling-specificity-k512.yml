name: Pontifex SciFact coupling-specificity K512

on:
  pull_request:
    paths:
      - "experiments/pontifex_benchmarks/scifact_coupling_specificity_k512.py"
      - "experiments/pontifex_benchmarks/PROTOCOL-SCIFACT-COUPLING-SPECIFICITY-K512-2026-09-19.md"
      - ".github/workflows/pontifex-scifact-coupling-specificity-k512.yml"
  workflow_dispatch:

jobs:
  coupling-null-k512:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Restore SciFact minimal representation cache
        uses: actions/cache@v4
        with:
          path: |
            .cache/pontifex-scifact
            ~/.cache/huggingface
          key: pontifex-scifact-coupling-k512-v1-${{ runner.os }}
          restore-keys: |
            pontifex-scifact-coupling-v1-
            pontifex-scifact-side-v1-
            pontifex-scifact-transport-v2-
            pontifex-scifact-transport-v1-

      - name: Run frozen K512 coupling-specificity scaling diagnostic
        run: |
          uv run experiments/pontifex_benchmarks/scifact_coupling_specificity_k512.py \
            --seed 20260919 \
            --cache-dir .cache/pontifex-scifact \
            --output /tmp/pontifex-scifact-coupling-specificity-k512.json

      - name: Upload K512 coupling-specificity record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pontifex-scifact-coupling-specificity-k512
          path: /tmp/pontifex-scifact-coupling-specificity-k512.json
          if-no-files-found: error
