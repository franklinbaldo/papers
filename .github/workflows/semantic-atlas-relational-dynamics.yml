name: Semantic Atlas relational dynamics

on:
  pull_request:
    paths:
      - "experiments/semantic_atlas/**"
      - ".github/workflows/semantic-atlas-relational-dynamics.yml"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: experiments/semantic_atlas
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[models,dev]"
      - name: Unit tests
        run: pytest -q tests/test_relational_dynamics.py
      - name: Run frozen relational dynamics v1
        run: python scripts/run_relational_dynamics.py
      - uses: actions/upload-artifact@v4
        with:
          name: semantic-atlas-relational-dynamics-v1
          path: |
            experiments/semantic_atlas/artifacts/relational_dynamics_v1.json
            experiments/semantic_atlas/artifacts/embedding_cache_relational_v1/**
          if-no-files-found: error
