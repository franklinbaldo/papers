name: Semantic Atlas relational dynamics

on:
  pull_request:
    paths:
      - "experiments/semantic_atlas/relational_dynamics_v1.json"
      - "experiments/semantic_atlas/model_backed_a_v1.json"
      - "experiments/semantic_atlas/src/semantic_atlas/relational_dynamics.py"
      - "experiments/semantic_atlas/src/semantic_atlas/embedding_cache.py"
      - "experiments/semantic_atlas/src/semantic_atlas/frame.py"
      - "experiments/semantic_atlas/scripts/run_relational_dynamics.py"
      - "experiments/semantic_atlas/tests/test_relational_dynamics.py"
      - ".github/workflows/semantic-atlas-relational-dynamics.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: experiments/semantic_atlas
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[models,dev]"
      - name: Unit tests
        run: pytest -q tests/test_relational_dynamics.py
      - name: Run frozen relational dynamics v1
        run: python scripts/run_relational_dynamics.py
      - uses: actions/upload-artifact@v4
        with:
          name: semantic-atlas-relational-dynamics-v1
          path: |
            experiments/semantic_atlas/artifacts/relational_dynamics_v1.json
            experiments/semantic_atlas/artifacts/embedding_cache_relational_v1/**
          if-no-files-found: error
          retention-days: 90
      - name: Persist primary data on same-repository PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/semantic_atlas/artifacts/relational_dynamics_v1.json
          git add experiments/semantic_atlas/artifacts/embedding_cache_relational_v1
          if git diff --cached --quiet; then
            echo "Primary data already versioned."
            exit 0
          fi
          git commit -m "data: persist relational dynamics v1 primary data"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
