name: Pontifex SciFact norm-matched coupling K512

on:
  pull_request:
    paths:
      - "experiments/pontifex_benchmarks/scifact_norm_matched_coupling_k512.py"
      - "experiments/pontifex_benchmarks/PROTOCOL-SCIFACT-NORM-MATCHED-COUPLING-K512-2026-09-19.md"
      - ".github/workflows/pontifex-scifact-norm-matched-coupling-k512.yml"
  workflow_dispatch:

jobs:
  norm-matched-coupling-k512:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Restore SciFact representation cache
        uses: actions/cache@v4
        with:
          path: |
            .cache/pontifex-scifact
            ~/.cache/huggingface
          key: pontifex-scifact-norm-matched-k512-v1-${{ runner.os }}
          restore-keys: |
            pontifex-scifact-coupling-k512-v1-
            pontifex-scifact-coupling-v1-
            pontifex-scifact-side-v1-
            pontifex-scifact-transport-v2-
            pontifex-scifact-transport-v1-

      - name: Run frozen norm-matched K512 mechanism null
        run: |
          uv run experiments/pontifex_benchmarks/scifact_norm_matched_coupling_k512.py \
            --seed 20260919 \
            --k 512 \
            --n-null 63 \
            --n-strata 8 \
            --cache-dir .cache/pontifex-scifact \
            --output /tmp/pontifex-scifact-norm-matched-coupling-k512.json

      - name: Upload norm-matched mechanism record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pontifex-scifact-norm-matched-coupling-k512
          path: /tmp/pontifex-scifact-norm-matched-coupling-k512.json
          if-no-files-found: error
