name: Semantic spectral bottleneck — implicit confidence transfer

on:
  pull_request:
    paths:
      - "experiments/semantic_atlas/spectral_bottleneck/confidence_transfer.py"
      - "experiments/semantic_atlas/spectral_bottleneck/test_confidence_transfer.py"
      - "experiments/semantic_atlas/spectral_bottleneck/confirmatory_endpoint.py"
      - "experiments/semantic_atlas/spectral_bottleneck/observer_comparison.py"
      - "experiments/semantic_atlas/spectral_bottleneck/real_model_experiment.py"
      - "experiments/semantic_atlas/spectral_bottleneck/requirements-real.txt"
      - ".github/workflows/semantic-spectral-confidence-transfer.yml"
  push:
    branches: [main]
    paths:
      - "experiments/semantic_atlas/spectral_bottleneck/confidence_transfer.py"
      - "experiments/semantic_atlas/spectral_bottleneck/test_confidence_transfer.py"
      - "experiments/semantic_atlas/spectral_bottleneck/confirmatory_endpoint.py"
      - "experiments/semantic_atlas/spectral_bottleneck/observer_comparison.py"
      - "experiments/semantic_atlas/spectral_bottleneck/real_model_experiment.py"
      - "experiments/semantic_atlas/spectral_bottleneck/requirements-real.txt"
      - ".github/workflows/semantic-spectral-confidence-transfer.yml"
  workflow_dispatch:

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HF_HOME: /tmp/hf-cache
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: experiments/semantic_atlas/spectral_bottleneck/requirements-real.txt

      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install experiment dependencies
        run: python -m pip install -r experiments/semantic_atlas/spectral_bottleneck/requirements-real.txt

      - name: Validate frozen transfer protocol
        working-directory: experiments/semantic_atlas/spectral_bottleneck
        run: >-
          python -m unittest -v
          test_real_model_experiment.py
          test_confirmatory_endpoint.py
          test_confidence_transfer.py

      - name: Run implicit confidence transfer
        working-directory: experiments/semantic_atlas/spectral_bottleneck
        run: >-
          python confidence_transfer.py
          --model HuggingFaceTB/SmolLM2-135M
          --revision 93efa2f097d58c2a74874c7e644dbc9b0cee75a2
          --batch-size 16
          --max-length 96
          --output results-confidence-transfer

      - name: Publish scientific result summary
        if: always()
        run: |
          if [ -f experiments/semantic_atlas/spectral_bottleneck/results-confidence-transfer/summary.md ]; then
            cat experiments/semantic_atlas/spectral_bottleneck/results-confidence-transfer/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload transfer result artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: semantic-spectral-confidence-transfer
          path: experiments/semantic_atlas/spectral_bottleneck/results-confidence-transfer/
          if-no-files-found: error
