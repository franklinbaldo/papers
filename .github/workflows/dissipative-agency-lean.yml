name: Dissipative agency Lean proofs

on:
  pull_request:
    paths:
      - 'sparse_intelligence_dissipative_universe.md'
      - 'formalizations/dissipative_agency/**'
      - 'experiments/dissipative_agency/**'
      - '.github/workflows/dissipative-agency-lean.yml'
  push:
    branches:
      - 'paper/dissipative-agency'
    paths:
      - 'sparse_intelligence_dissipative_universe.md'
      - 'formalizations/dissipative_agency/**'
      - 'experiments/dissipative_agency/**'
      - '.github/workflows/dissipative-agency-lean.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y

      - name: Install Lean 4.22.0
        run: |
          "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.22.0

      - name: Check dissipative-agency ontology
        run: |
          "$HOME/.elan/bin/elan" run leanprover/lean4:v4.22.0 \
            lean formalizations/dissipative_agency/DissipativeAgency.lean
