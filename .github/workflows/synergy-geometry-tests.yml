name: Synergy geometry apparatus tests

on:
  pull_request:
    paths:
      - 'synergy-geometry/experiments/**'
      - '.github/workflows/synergy-geometry-tests.yml'
  push:
    branches:
      - 'experiment/synergy-geometry-**'
    paths:
      - 'synergy-geometry/experiments/**'
      - '.github/workflows/synergy-geometry-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: synergy-geometry/experiments
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: pytest -q
