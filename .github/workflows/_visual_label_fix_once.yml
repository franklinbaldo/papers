name: One-shot Mermaid label fix

on:
  push:
    branches:
      - docs/visual-round-20260917-19

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/visual-round-20260917-19
          fetch-depth: 0
      - name: Normalize multiline Mermaid labels
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "affordance_restriction.md": {
                  'Tier 2 · electronic citation\\nabstract after specialization': 'Tier 2 · electronic citation<br/>abstract after specialization',
                  'Tier 1 · register procedural deadline\\ndoctrinal outcome': 'Tier 1 · register procedural deadline<br/>doctrinal outcome',
                  'Tier 2 · mere acknowledgment\\nbindable leaf': 'Tier 2 · mere acknowledgment<br/>bindable leaf',
                  'Tier 3 · no work-box assigned\\nbindable leaf': 'Tier 3 · no work-box assigned<br/>bindable leaf',
              },
              "paper1D_vinculacao_racional_dialogo_institucional.md": {
                  'Vício de fundamentação\\nart. 489 §1º VI': 'Vício de fundamentação<br/>art. 489 §1º VI',
                  'Novo déficit de fundamentação\\nna tese do artigo': 'Novo déficit de fundamentação<br/>na tese do artigo',
              },
              "paper1F_reputacao_sistema_juridico.md": {
                  'Qualidade argumentativa\\nparcialmente latente': 'Qualidade argumentativa<br/>parcialmente latente',
                  'Proxies observáveis\\nafiliação · histórico · titulação · network': 'Proxies observáveis<br/>afiliação · histórico · titulação · network',
                  'Atenção, confiança e resposta\\nna interação jurídica': 'Atenção, confiança e resposta<br/>na interação jurídica',
                  'Redução tecnológica do custo\\nde verificações textuais identificáveis': 'Redução tecnológica do custo<br/>de verificações textuais identificáveis',
                  'Qualidade observada repetidamente\\nno canal local': 'Qualidade observada repetidamente<br/>no canal local',
              },
              "structural_identification_from_restricted_truths.md": {
                  'Hypothesis class H\\ncandidate structures': 'Hypothesis class H<br/>candidate structures',
                  'Admissible invariant\\nquery family Q': 'Admissible invariant<br/>query family Q',
                  'Quotient by structural\\nequivalence ~': 'Quotient by structural<br/>equivalence ~',
                  'How many equivalence\\nclasses survive?': 'How many equivalence<br/>classes survive?',
              },
              "semantic_atlas_manifolds.md": {
                  'Local state\\nactive charts + intrinsic coordinates': 'Local state<br/>active charts + intrinsic coordinates',
                  'Global state\\ncalibrated SRF position': 'Global state<br/>calibrated SRF position',
                  'Semantic quasars\\nreference geometry': 'Semantic quasars<br/>reference geometry',
                  'Support graph + diffusion\\n+ spectral observables': 'Support graph + diffusion<br/>+ spectral observables',
              },
          }

          for path, changes in replacements.items():
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              for old, new in changes.items():
                  if text.count(old) != 1:
                      raise SystemExit(f"{path}: expected exactly one occurrence of {old!r}")
                  text = text.replace(old, new, 1)
              p.write_text(text, encoding="utf-8")
          PY
      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          rm .github/workflows/_visual_label_fix_once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add affordance_restriction.md \
            paper1D_vinculacao_racional_dialogo_institucional.md \
            paper1F_reputacao_sistema_juridico.md \
            structural_identification_from_restricted_truths.md \
            semantic_atlas_manifolds.md \
            .github/workflows/_visual_label_fix_once.yml
          git diff --cached --check
          git commit -m "docs: normalize Mermaid multiline labels"
          git push origin HEAD:docs/visual-round-20260917-19
