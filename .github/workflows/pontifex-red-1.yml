name: Pontifex RED-1

on:
  workflow_dispatch:

jobs:
  red-1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: pontifex-red1-${{ runner.os }}-${{ hashFiles('experiments/pontifex_red1/run.py') }}
          restore-keys: |
            pontifex-red1-${{ runner.os }}-

      - name: Run falsification experiment
        run: |
          uv run experiments/pontifex_red1/run.py \
            --examples 240 \
            --seeds 0 1 2 \
            --output /tmp/pontifex-red1-result.json

      - name: Publish result summary
        if: always()
        run: |
          if [ -f /tmp/pontifex-red1-result.md ]; then
            cat /tmp/pontifex-red1-result.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pontifex-red1-result
          path: |
            /tmp/pontifex-red1-result.json
            /tmp/pontifex-red1-result.md
          if-no-files-found: warn
