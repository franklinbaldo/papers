name: Pontifex transport regime contrast

on:
  pull_request:
    paths:
      - "experiments/pontifex_torus/transport_regime_contrast.py"
      - "experiments/pontifex_torus/interaction_topology_ablation.py"
      - "experiments/pontifex_torus/quadratic_term_ablation.py"
      - "experiments/pontifex_torus/transport_bottleneck_ablation.py"
      - "experiments/pontifex_torus/virtual_resolution.py"
      - ".github/workflows/pontifex-transport-regime-contrast.yml"
  workflow_dispatch:

jobs:
  contrast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SHORT_STORE: .cache/pontifex-scale/field-2000-size1-allstarts-17.npz
      LONG_STORE: .cache/pontifex-long-topology/field-800-c4-p32-seed29.npz

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Restore short field
        id: short-cache
        uses: actions/cache@v4
        with:
          path: .cache/pontifex-scale
          key: pontifex-scale-v1-2000-size1-17-${{ hashFiles('experiments/pontifex_torus/build_field_store.py') }}

      - name: Restore long field
        id: long-cache
        uses: actions/cache@v4
        with:
          path: .cache/pontifex-long-topology
          key: pontifex-long-topology-v1-800-c4-p32-29-${{ hashFiles('experiments/pontifex_torus/build_long_field_store.py') }}

      - name: Restore encoder weights on cache miss
        if: steps.short-cache.outputs.cache-hit != 'true' || steps.long-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: pontifex-models-v1-${{ runner.os }}
          restore-keys: |
            pontifex-models-v1-${{ runner.os }}
            pontifex-torus-${{ runner.os }}-
            pontifex-red1-${{ runner.os }}-

      - name: Build short field on cache miss
        if: steps.short-cache.outputs.cache-hit != 'true'
        run: |
          uv run experiments/pontifex_torus/build_field_store.py \
            --texts 2000 \
            --positions 32 \
            --sizes 1 \
            --seed 17 \
            --output "$SHORT_STORE"

      - name: Build long field on cache miss
        if: steps.long-cache.outputs.cache-hit != 'true'
        run: |
          uv run experiments/pontifex_torus/build_long_field_store.py \
            --texts 800 \
            --positions 32 \
            --clauses 4 \
            --seed 29 \
            --output "$LONG_STORE"

      - name: Run short-vs-long degree-2 contrast
        run: |
          uv run experiments/pontifex_torus/transport_regime_contrast.py \
            --short-store "$SHORT_STORE" \
            --long-store "$LONG_STORE" \
            --seeds 0 1 2 \
            --dense-train-grid 512 \
            --harmonics 8 \
            --anchors 256 \
            --edge-budget 36 \
            --random-reps 12 \
            --alphas 0.1 1 10 \
            --output /tmp/pontifex-transport-regime-contrast.json

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pontifex-transport-regime-contrast
          path: /tmp/pontifex-transport-regime-contrast.json
          if-no-files-found: error
