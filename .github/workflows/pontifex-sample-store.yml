name: Pontifex sampled feature store

on:
  pull_request:
    paths:
      - "experiments/pontifex_red1/sample_manifest.py"
      - "experiments/pontifex_red1/extract_sample_store.py"
      - ".github/workflows/pontifex-sample-store.yml"
  workflow_dispatch:
    inputs:
      index:
        description: "Pyserini prebuilt FAISS alias"
        required: false
        default: "msmarco-v1-passage.tct_colbert-v2-hnp"
      sample_size:
        description: "Number of fixed sample PIDs to extract"
        required: false
        default: "10000"

jobs:
  sample-store:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Resolve sample size
        id: cfg
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "size=${{ github.event.inputs.sample_size }}" >> "$GITHUB_OUTPUT"
            echo "index=${{ github.event.inputs.index }}" >> "$GITHUB_OUTPUT"
          else
            echo "size=1000" >> "$GITHUB_OUTPUT"
            echo "index=msmarco-v1-passage.tct_colbert-v2-hnp" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate fixed PID manifest
        run: |
          uv run experiments/pontifex_red1/sample_manifest.py \
            --size "${{ steps.cfg.outputs.size }}" \
            --output /tmp/msmarco-sample.json

      - name: Extract sampled embeddings from mmap index
        run: |
          uv run experiments/pontifex_red1/extract_sample_store.py \
            --index "${{ steps.cfg.outputs.index }}" \
            --size "${{ steps.cfg.outputs.size }}" \
            --output /tmp/msmarco-sample-store.npz

      - name: Publish summary
        if: always()
        run: |
          echo "## Pontifex sampled feature store" >> "$GITHUB_STEP_SUMMARY"
          echo "- sample size: ${{ steps.cfg.outputs.size }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- index: \`${{ steps.cfg.outputs.index }}\`" >> "$GITHUB_STEP_SUMMARY"
          if [ -f /tmp/msmarco-sample-store.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/msmarco-sample-store.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload compact feature store
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pontifex-msmarco-sample-${{ steps.cfg.outputs.size }}
          path: |
            /tmp/msmarco-sample.json
            /tmp/msmarco-sample-store.npz
            /tmp/msmarco-sample-store.json
          if-no-files-found: warn
