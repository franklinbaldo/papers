name: OKF conformance

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate OKF v0.2 bundle
        uses: franklinbaldo/okf-parser@v0.45.9
        with:
          path: .
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Test Zenodo deposit preparation
        run: python3 scripts/zenodo_prepare.py --self-test
      - name: Validate all Zenodo-ready paper bundles
        run: python3 scripts/zenodo_validate_ready.py
