name: Semantic Atlas toy tests

on:
  pull_request:
    paths:
      - 'semantic-atlas/experiments/**'
      - '.github/workflows/semantic-atlas-tests.yml'
  push:
    branches:
      - 'semantic-atlas/**'
    paths:
      - 'semantic-atlas/experiments/**'
      - '.github/workflows/semantic-atlas-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: semantic-atlas/experiments
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: pytest -q
