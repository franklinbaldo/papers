name: Apply STT Zenodo readiness fix

on:
  push:
    branches:
      - automation/zenodo-stt-593-20260919-0727

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/zenodo-stt-593-20260919-0727
      - name: Apply audited manuscript edits
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/fix_stt.py
          python /tmp/fix_stt.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add semantic_tokenization_transformers.md
          git rm .github/workflows/automation-stt-593.yml
          git commit -m "fix: make STT Zenodo-ready (#593)"
          git push origin HEAD:automation/zenodo-stt-593-20260919-0727
