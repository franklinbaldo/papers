name: One-shot visual paper patch

on:
  push:
    branches:
      - docs/visual-round-20260917-19

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/visual-round-20260917-19
          fetch-depth: 0

      - name: Apply five scientific visual interventions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one anchor, found {count}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          # 1) Affordance restriction: restore the missing Figure 2 as an actual canon DAG.
          path = "affordance_restriction.md"
          old = """Non-leaves are *abstract*: adding a deeper specialization that concretizes them automatically retires them from direct binding for that branch.\n\n**Figure 2.** *Tier hierarchy in the canon. Tier 1 declares outcome; Tier 2 concretizes Tier 1 via `@concretiza:` edges pointing at content hashes; Tier 3 adds situational specialization. The graph is a DAG by construction (edges flow only from higher tiers to strictly lower tiers).*"""
          new = """Non-leaves are *abstract*: adding a deeper specialization that concretizes them automatically retires them from direct binding for that branch.\n\n```mermaid\nflowchart BT\n    T2A[\"Tier 2 · electronic citation\\nabstract after specialization\"] -->|concretizes by hash| T1[\"Tier 1 · register procedural deadline\\ndoctrinal outcome\"]\n    T2B[\"Tier 2 · mere acknowledgment\\nbindable leaf\"] -->|concretizes by hash| T1\n    T3[\"Tier 3 · no work-box assigned\\nbindable leaf\"] -->|concretizes by hash| T2A\n```\n\n**Figure 2.** *Tier hierarchy in the canon. Concretization references point from more specific entries to strictly lower tiers by content hash. The Tier 2 citation entry becomes abstract once the Tier 3 specialization exists; only leaves remain directly bindable.*"""
          replace_once(path, old, new)

          # 2) Rational binding: make the symmetric reasoning burden a decision structure.
          path = "paper1D_vinculacao_racional_dialogo_institucional.md"
          old = """A resposta \"a súmula vinculante assim determina\"\nnão é fundamentação; é circularidade que o art. 489, §1º, IV,\nproíbe expressamente.\n\n**Objeção antecipada: conformidade e mérito na reclamação.**"""
          new = """A resposta \"a súmula vinculante assim determina\"\nnão é fundamentação; é circularidade que o art. 489, §1º, IV,\nproíbe expressamente.\n\nA simetria defendida aqui pode ser lida como uma sequência de ônus argumentativos, não como garantia de que o afastamento será mantido. O ponto do diagrama é separar a suficiência formal das razões do seu mérito e mostrar onde o dever de enfrentamento reaparece na reclamação.\n\n```mermaid\nflowchart TD\n    D[Órgão inferior diante de precedente vinculante] --> A{Afasta o precedente?}\n    A -- Não --> AP[Aplica com demonstração de aderência]\n    A -- Sim --> R{Expõe razões de distinção ou superação?}\n    R -- Não --> V[Vício de fundamentação\\nart. 489 §1º VI]\n    R -- Sim --> C[Reclamação leva as razões ao STF]\n    C --> E{STF enfrenta as razões expostas?}\n    E -- Não --> O[Novo déficit de fundamentação\\nna tese do artigo]\n    E -- Sim --> M{Razões convencem no mérito?}\n    M -- Não --> F[STF refuta e preserva o precedente]\n    M -- Sim --> X[STF distingue ou revê o entendimento]\n```\n\nA figura não transforma a tese dogmática em descrição empírica da prática do STF: ela explicita a estrutura normativa que o artigo sustenta e os pontos distintos em que forma e mérito são avaliados.\n\n**Objeção antecipada: conformidade e mérito na reclamação.**"""
          replace_once(path, old, new)

          # 3) Reputation: distinguish proxy-mediated reputation from the narrower direct-verification channel.
          path = "paper1F_reputacao_sistema_juridico.md"
          old = """artigo não desenvolve. A seção 4.3 discute, além disso, obstáculos\nestruturais à própria acumulação do canal local no contexto brasileiro.\n\n### 4.2 A resistência à recalibração"""
          new = """artigo não desenvolve. A seção 4.3 discute, além disso, obstáculos\nestruturais à própria acumulação do canal local no contexto brasileiro.\n\nO mecanismo proposto é mais estreito do que uma substituição geral de reputação por auditoria. Ele prevê mudança de peso entre dois canais de informação justamente nos contextos em que parte da qualidade argumentativa se torna verificável a baixo custo.\n\n```mermaid\nflowchart TD\n    Q[Qualidade argumentativa\\nparcialmente latente] --> D[Verificação direta]\n    P[Proxies observáveis\\nafiliação · histórico · titulação · network] --> R[Reputação esperada]\n    D --> R\n    R --> T[Atenção, confiança e resposta\\nna interação jurídica]\n\n    C[Redução tecnológica do custo\\nde verificações textuais identificáveis] --> D\n    C -. pode reduzir peso relativo .-> P\n    D --> L[Qualidade observada repetidamente\\nno canal local]\n    L --> R\n    F[Sorteio · rodízio · assessoria] -. limita acumulação .-> L\n```\n\nAs setas pontilhadas registram hipóteses e limites, não efeitos já medidos: o artigo não demonstra democratização reputacional em rede, e os obstáculos organizacionais podem enfraquecer até o canal local.\n\n### 4.2 A resistência à recalibração"""
          replace_once(path, old, new)

          # 4) Structural identification: visualize the version-space quotient that defines success.
          path = "structural_identification_from_restricted_truths.md"
          old = """V_{\\mathcal H}(E)/{\\sim}\n=\n\\{[\\mathcal A]\\}.\n\\]\n\n---\n\n## 4. Elementary laws of structural version spaces"""
          new = """V_{\\mathcal H}(E)/{\\sim}\n=\n\\{[\\mathcal A]\\}.\n\\]\n\nThe definition is easiest to read as two successive reductions. Evidence removes candidates that fail an admissible truth; structural equivalence then quotients away multiple presentations that count as the same answer. Identification occurs only when one equivalence class remains.\n\n```mermaid\nflowchart LR\n    H[Hypothesis class H\\ncandidate structures] --> E[Filter by sound evidence E ⊆ Q]\n    Q[Admissible invariant\\nquery family Q] --> E\n    E --> V[Version space V_H(E)]\n    V --> X[Quotient by structural\\nequivalence ~]\n    X --> G{How many equivalence\\nclasses survive?}\n    G -- One: [A] --> I[Target identified up to ~]\n    G -- More than one --> U[Structurally unresolved]\n```\n\nThe diagram also locates the observational-equivalence barrier proved below: if a non-equivalent competitor cannot be separated by any query in \(\\mathcal Q\), no choice of \(E\subseteq\\mathcal Q\) can remove its class before the quotient.\n\n---\n\n## 4. Elementary laws of structural version spaces"""
          replace_once(path, old, new)

          # 5) Manifold-aware Atlas: replace the text-only pipeline with a two-scale architecture.
          path = "semantic_atlas_manifolds.md"
          old = """The resulting architecture becomes:\n\n```text\nlanguage model activations\n          ↓\nconcept-manifold featurizer\n          ↓\nlocal manifold coordinates + active concept blocks\n          ↓\nSemantic Reference Frame / quasars\n          ↓\nmanifold-aware Semantic Atlas\n          ↓\nlocal support graph / diffusion operator / spectral observables\n          ↓\ninter-manifold route + intra-manifold path\n          ↓\ngeometry-aware Semantic Servo\n          ↓\nlexical generation\n```"""
          new = """The resulting architecture has two measurement scales that meet in the atlas rather than one undifferentiated pipeline:\n\n```mermaid\nflowchart LR\n    H[Language-model activations] --> F[Concept-manifold featurizer]\n    F --> L[Local state\\nactive charts + intrinsic coordinates]\n    H --> G[Global state\\ncalibrated SRF position]\n    Q[Semantic quasars\\nreference geometry] --> G\n    L --> A[Manifold-aware Semantic Atlas]\n    G --> A\n    A --> S[Support graph + diffusion\\n+ spectral observables]\n    A --> R[Inter-manifold route]\n    A --> P[Intra-manifold path]\n    S --> R\n    S --> P\n    R --> C[Geometry-aware Semantic Servo]\n    P --> C\n    C --> Y[Lexical generation]\n```\n\nThe split is load-bearing: the SRF locates conceptual regions globally, while chart coordinates and support geometry describe motion inside them. Neither branch is claimed to be sufficient by itself, and the original point-space Atlas remains the matched baseline."""
          replace_once(path, old, new)
          PY

      - name: Remove one-shot workflow and commit documentation-only patch
        shell: bash
        run: |
          rm .github/workflows/_visual_round_once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add affordance_restriction.md \
            paper1D_vinculacao_racional_dialogo_institucional.md \
            paper1F_reputacao_sistema_juridico.md \
            structural_identification_from_restricted_truths.md \
            semantic_atlas_manifolds.md \
            .github/workflows/_visual_round_once.yml
          git diff --cached --check
          git commit -m "docs: sharpen five scientific diagrams"
          git push origin HEAD:docs/visual-round-20260917-19
