name: Semantic spectral confidence — relative-depth confirmation

on:
  pull_request:
    paths:
      - "experiments/semantic_atlas/spectral_bottleneck/relative_depth_confirmation.py"
      - "experiments/semantic_atlas/spectral_bottleneck/test_relative_depth_confirmation.py"
      - ".github/workflows/semantic-spectral-relative-depth-confirm.yml"
  push:
    branches: [main]
    paths:
      - "experiments/semantic_atlas/spectral_bottleneck/relative_depth_confirmation.py"
      - "experiments/semantic_atlas/spectral_bottleneck/test_relative_depth_confirmation.py"
      - ".github/workflows/semantic-spectral-relative-depth-confirm.yml"
  workflow_dispatch:

jobs:
  confirm-relative-depth:
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: smollm2-135m
            model: HuggingFaceTB/SmolLM2-135M
            revision: 93efa2f097d58c2a74874c7e644dbc9b0cee75a2
            batch_size: 16
          - id: smollm2-360m
            model: HuggingFaceTB/SmolLM2-360M
            revision: f8027fd0eaeea54caa13c31d31b9fdc459c38b49
            batch_size: 8
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_HOME: /tmp/hf-cache
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: experiments/semantic_atlas/spectral_bottleneck/requirements-real.txt

      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install experiment dependencies
        run: python -m pip install -r experiments/semantic_atlas/spectral_bottleneck/requirements-real.txt

      - name: Validate frozen relative-depth protocol
        working-directory: experiments/semantic_atlas/spectral_bottleneck
        run: >-
          python -m unittest -v
          test_real_model_experiment.py
          test_confidence_transfer.py
          test_relative_depth_confirmation.py

      - name: Run fresh relative-depth confirmation
        working-directory: experiments/semantic_atlas/spectral_bottleneck
        run: >-
          python relative_depth_confirmation.py
          --model ${{ matrix.model }}
          --revision ${{ matrix.revision }}
          --batch-size ${{ matrix.batch_size }}
          --max-length 96
          --output results-relative-depth-${{ matrix.id }}

      - name: Publish confirmation summary
        if: always()
        run: |
          if [ -f experiments/semantic_atlas/spectral_bottleneck/results-relative-depth-${{ matrix.id }}/summary.md ]; then
            cat experiments/semantic_atlas/spectral_bottleneck/results-relative-depth-${{ matrix.id }}/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload confirmation artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: semantic-spectral-relative-depth-${{ matrix.id }}
          path: experiments/semantic_atlas/spectral_bottleneck/results-relative-depth-${{ matrix.id }}/
          if-no-files-found: error
