name: Pontifex CMB nonlocal observable ablation

on:
  pull_request:
    paths:
      - "experiments/pontifex_torus/cmb_nonlocal_observable_ablation.py"
      - ".github/workflows/pontifex-cmb-nonlocal-observable.yml"
  workflow_dispatch:
    inputs:
      skies:
        description: "Independent synthetic skies"
        required: false
        default: "8"
      null_maps:
        description: "Matched null maps per theta"
        required: false
        default: "64"

jobs:
  nonlocal-observable:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Run nonlocal observable ablation
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            SKIES=8
            NULLS=64
          else
            SKIES="${{ github.event.inputs.skies || '8' }}"
            NULLS="${{ github.event.inputs.null_maps || '64' }}"
          fi
          uv run experiments/pontifex_torus/cmb_nonlocal_observable_ablation.py \
            --skies "$SKIES" \
            --theta-per-cell 4 \
            --null-maps "$NULLS" \
            --beam-sigma 2.0 \
            --ny 64 --nx 128 \
            --scores /tmp/pontifex-cmb-nonlocal-scores.jsonl \
            --output /tmp/pontifex-cmb-nonlocal-observable.json

      - name: Summarize
        if: always()
        run: |
          if [ -f /tmp/pontifex-cmb-nonlocal-observable.json ]; then
            echo "## CMB nonlocal observable ablation" >> "$GITHUB_STEP_SUMMARY"
            echo '~~~json' >> "$GITHUB_STEP_SUMMARY"
            python -c 'import json; x=json.load(open("/tmp/pontifex-cmb-nonlocal-observable.json")); print(json.dumps(x["dimensionality_discriminant"], indent=2))' >> "$GITHUB_STEP_SUMMARY"
            echo '~~~' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pontifex-cmb-nonlocal-observable
          path: |
            /tmp/pontifex-cmb-nonlocal-observable.json
            /tmp/pontifex-cmb-nonlocal-scores.jsonl
          if-no-files-found: warn
