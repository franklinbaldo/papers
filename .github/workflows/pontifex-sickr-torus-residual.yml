name: Pontifex SICK-R Torus residual benchmark

on:
  push:
    branches:
      - "experiment/pontifex-red-1"
    paths:
      - "experiments/pontifex_benchmarks/sickr_torus_residual.py"
      - "experiments/pontifex_benchmarks/PROTOCOL-SICKR-TORUS-RESIDUAL-2026-09-19.md"
      - ".github/workflows/pontifex-sickr-torus-residual.yml"
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EMB_CACHE: .cache/pontifex-sickr/sickr-minilm-mpnet-v1.npz

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Restore encoder weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: pontifex-stsb-models-v1-${{ runner.os }}
          restore-keys: |
            pontifex-stsb-models-v1-${{ runner.os }}
            pontifex-models-v1-${{ runner.os }}-

      - name: Restore encoded SICK-R union
        uses: actions/cache@v4
        with:
          path: .cache/pontifex-sickr
          key: pontifex-sickr-emb-v1-minilm-mpnet-${{ hashFiles('experiments/pontifex_benchmarks/sickr_torus_residual.py') }}
          restore-keys: |
            pontifex-sickr-emb-v1-minilm-mpnet-

      - name: Run frozen SICK-R benchmark
        run: |
          uv run experiments/pontifex_benchmarks/sickr_torus_residual.py \
            --budgets 8 16 32 64 128 256 \
            --seed 20260919 \
            --cache "$EMB_CACHE" \
            --output /tmp/pontifex-sickr-torus-residual.json

      - name: Publish summary
        if: always()
        run: |
          if [ -f /tmp/pontifex-sickr-torus-residual.json ]; then
            echo '## Pontifex SICK-R Torus residual benchmark' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/pontifex-sickr-torus-residual.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload benchmark artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pontifex-sickr-torus-residual
          path: /tmp/pontifex-sickr-torus-residual.json
          if-no-files-found: error
