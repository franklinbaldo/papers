name: Reward-conditioned retrieval experiment

on:
  pull_request:
    paths:
      - "experiments/reward_conditioned_retrieval/**"
      - ".github/workflows/reward-conditioned-retrieval.yml"
  push:
    branches: [main]
    paths:
      - "experiments/reward_conditioned_retrieval/**"
      - ".github/workflows/reward-conditioned-retrieval.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: experiments/reward_conditioned_retrieval/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r experiments/reward_conditioned_retrieval/requirements.txt
      - name: Run unit tests
        working-directory: experiments/reward_conditioned_retrieval
        run: python -m unittest -v test_experiment.py
      - name: Run smoke experiment
        working-directory: experiments/reward_conditioned_retrieval
        run: >-
          python experiment.py
          --train-episodes 1000
          --eval-episodes 250
          --seeds 2
          --output results
