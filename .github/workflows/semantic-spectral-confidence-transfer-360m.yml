name: Semantic spectral confidence transfer — SmolLM2-360M replication

on:
  pull_request:
    paths:
      - ".github/workflows/semantic-spectral-confidence-transfer-360m.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/semantic-spectral-confidence-transfer-360m.yml"
  workflow_dispatch:

jobs:
  replicate-360m:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_HOME: /tmp/hf-cache
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: experiments/semantic_atlas/spectral_bottleneck/requirements-real.txt

      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install experiment dependencies
        run: python -m pip install -r experiments/semantic_atlas/spectral_bottleneck/requirements-real.txt

      - name: Validate frozen transfer protocol
        working-directory: experiments/semantic_atlas/spectral_bottleneck
        run: python -m unittest -v test_confidence_transfer.py

      - name: Run unchanged transfer on pinned 360M checkpoint
        working-directory: experiments/semantic_atlas/spectral_bottleneck
        run: >-
          python confidence_transfer.py
          --model HuggingFaceTB/SmolLM2-360M
          --revision f8027fd0eaeea54caa13c31d31b9fdc459c38b49
          --batch-size 8
          --max-length 96
          --output results-confidence-transfer-360m

      - name: Publish scientific result summary
        if: always()
        run: |
          if [ -f experiments/semantic_atlas/spectral_bottleneck/results-confidence-transfer-360m/summary.md ]; then
            cat experiments/semantic_atlas/spectral_bottleneck/results-confidence-transfer-360m/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload 360M replication artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: semantic-spectral-confidence-transfer-360m
          path: experiments/semantic_atlas/spectral_bottleneck/results-confidence-transfer-360m/
          if-no-files-found: error
