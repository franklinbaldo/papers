name: Pontifex CMB null-family localization

on:
  pull_request:
    paths:
      - "experiments/pontifex_torus/cmb_null_family_localization.py"
      - "experiments/pontifex_torus/cmb_occlusion_mc.py"
      - "experiments/pontifex_torus/cmb_matched_null_robustness_ladder.py"
      - ".github/workflows/pontifex-cmb-null-family-localization.yml"
  workflow_dispatch:
    inputs:
      skies:
        description: "Independent synthetic skies"
        required: false
        default: "12"
      theta_per_cell:
        description: "Fixed theta replicates per geometry x occlusion cell"
        required: false
        default: "4"

jobs:
  null-family-localization:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Run fixed-theta family localization
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            SKIES=12
            THETA_PER_CELL=4
          else
            SKIES="${{ github.event.inputs.skies || '12' }}"
            THETA_PER_CELL="${{ github.event.inputs.theta_per_cell || '4' }}"
          fi
          uv run experiments/pontifex_torus/cmb_null_family_localization.py \
            --skies "$SKIES" \
            --theta-per-cell "$THETA_PER_CELL" \
            --null-counts 64 128 \
            --ny 64 --nx 128 \
            --scores /tmp/pontifex-cmb-null-family-scores.jsonl \
            --output /tmp/pontifex-cmb-null-family-localization.json

      - name: Summarize
        if: always()
        run: |
          if [ -f /tmp/pontifex-cmb-null-family-localization.json ]; then
            echo "## CMB null-family localization" >> "$GITHUB_STEP_SUMMARY"
            echo '~~~json' >> "$GITHUB_STEP_SUMMARY"
            python -c 'import json; x=json.load(open("/tmp/pontifex-cmb-null-family-localization.json")); print(json.dumps({"design":x["design"],"tail_localization_at_max_m":x["tail_localization_at_max_m"],"global_m128":x["global_by_m"]["128"],"family_m128":x["by_occlusion"]["128"]}, indent=2))' >> "$GITHUB_STEP_SUMMARY"
            echo '~~~' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pontifex-cmb-null-family-localization
          path: |
            /tmp/pontifex-cmb-null-family-localization.json
            /tmp/pontifex-cmb-null-family-scores.jsonl
          if-no-files-found: warn
