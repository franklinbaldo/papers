name: Truth-preserving representation tests

on:
  pull_request:
    paths:
      - 'experiments/truth_preserving_representations/**'
      - '.github/workflows/truth-preserving-representations-tests.yml'
  push:
    branches:
      - 'paper/truth-preserving-representations'
    paths:
      - 'experiments/truth_preserving_representations/**'
      - '.github/workflows/truth-preserving-representations-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: >-
          python -m unittest discover
          -s experiments/truth_preserving_representations
          -p 'test_*.py'
          -v
