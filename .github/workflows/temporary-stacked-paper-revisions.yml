name: Temporary stacked-paper revisions

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: write

jobs:
  revise:
    if: github.event.pull_request.head.repo.full_name == github.repository && (github.event.pull_request.number == 238 || github.event.pull_request.number == 241)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply revision
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          pr = int(os.environ['PR_NUMBER'])

          def revise(path_name: str, replacements: list[tuple[str, str]]) -> None:
              path = Path(path_name)
              text = path.read_text()
              for old, new in replacements:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path_name}: expected one match, found {count}: {old[:100]!r}')
                  text = text.replace(old, new, 1)
              path.write_text(text)

          if pr == 241:
              revise('pedagogical_signal_extraction.md', [
                  (
                      "The central hypothesis is that optimal teaching does not reduce to maximal compression or maximal raw entropy. An optimal pedagogical message may use highly diverse, locally irregular demonstrations while preserving a stable higher-order grammar that makes those demonstrations progressively decodable. The complementary learner hypothesis is that a good learner is not the system that finds the greatest number of patterns in a finite transcript, but the system that extracts compact invariants that survive new data, perturbation, and intervention while improving prediction of the teacher and execution of the target function.",
                      "The central hypothesis is that optimal teaching does not reduce to maximal compression or maximal raw entropy. An optimal pedagogical message may use highly diverse, locally irregular demonstrations while preserving a stable higher-order grammar that makes those demonstrations progressively decodable. The complementary learner hypothesis is that a good learner is not the system that finds the greatest number of patterns in a finite transcript, but the system that extracts compact invariants that survive new data, perturbation, and intervention while improving prediction of primitive future observations and execution of the target function. In the binary benchmark, the externally scored predictive task is next-bit prediction. Tokens, segments, and higher-order symbols are endogenous, context-dependent instruments that the learner may construct because they make prediction, transfer, or action more efficient; they are not privileged targets supplied by the benchmark."
                  ),
                  (
                      "The learner updates an internal model:\n\n$$\nM_t=U_A(M_{t-1},y_t).\n$$\n\nThe target is deterministic in this paper so that uncertainty about the interaction can be separated from uncertainty in the target itself.",
                      "The learner updates an internal model:\n\n$$\nM_t=U_A(M_{t-1},y_t).\n$$\n\nIn the strict binary track, $y_t\\in\\{0,1\\}$ and the primitive predictive objective is:\n\n$$\n-\\log p_A(y_{t+1}\\mid y_{1:t}).\n$$\n\nThe learner may internally encode a context-dependent substring as one token, a sequence of learned tokens as a higher-order token, or no token at all. These representations are justified by their contribution to prediction and competence, not by literal agreement with a canonical segmentation. Two learners may therefore construct different registries while being functionally equivalent at the observable bit interface.\n\nThe target is deterministic in this paper so that uncertainty about the interaction can be separated from uncertainty in the target itself."
                  ),
                  (
                      "The learner therefore learns not only $f$, but also enough of the teacher, channel, and representational protocol to identify which aspects of the transcript are relevant to $f$.",
                      "The learner therefore learns not only $f$, but also enough of the teacher, channel, and representational protocol to identify which aspects of the transcript are relevant to $f$. The hierarchy is: primitive observations are evidence, prediction and task competence are the externally evaluated objectives, and tokens are revisable internal instruments for reaching those objectives."
                  ),
                  (
                      "A better learner extracts **predictive invariants**: representations that compress relevant aspects of the past, improve prediction of the future, remain stable under appropriate perturbations, and support execution or transfer.",
                      "A better learner extracts **predictive invariants**: representations that compress relevant aspects of the past, improve prediction of the future, remain stable under appropriate perturbations, and support execution or transfer. In a bit-level channel, next-bit prediction remains the common external interface throughout this process. Tokenization is one possible internal realization of an invariant, not a separate primitive task."
                  ),
                  (
                      "Among learners with comparable resources, the better learner is the one that identifies the smallest stable representation sufficient for predicting future interaction and executing the target, rather than the one that achieves the greatest retrospective fit.",
                      "Among learners with comparable resources, the better learner is the one that identifies the smallest stable representation sufficient for predicting future interaction and executing the target, rather than the one that achieves the greatest retrospective fit. Literal token identity is not part of this criterion: distinct registries should be treated as equivalent when they induce comparable primitive predictions, task behavior, transfer, and total representational cost."
                  ),
                  (
                      "The first isolates structural learning. The second studies emergent coding. The third measures tolerance to arbitrary but stable conventions. The fourth introduces channel-like noise. The fifth is concealment and should not be counted as successful teaching for the specified learner.",
                      "The first isolates structural learning. The second studies emergent coding. The third measures tolerance to arbitrary but stable conventions. The fourth introduces channel-like noise. The fifth is concealment and should not be counted as successful teaching for the specified learner. Exact recovery of any one identifier system is a diagnostic only; the primary comparison is whether the induced representation improves prediction and target competence at the primitive observation interface."
                  ),
                  (
                      "For small deterministic function classes, exhaustively search teacher messages under fixed learners. Measure message length, policy complexity, competence threshold, and decodability profile. Test whether optimal messages exhibit staged structure rather than opaque one-shot encodings.",
                      "For small deterministic function classes, exhaustively search teacher messages under fixed learners. Use the same primitive next-observation or next-bit scoring interface for all learner representations. Measure message length, policy complexity, competence threshold, and decodability profile. Test whether optimal messages exhibit staged structure rather than opaque one-shot encodings, and whether different internal token systems can achieve equivalent observable competence."
                  ),
                  (
                      "**H4 — Predictive invariance.** Held-out prediction, transfer, and intervention stability will distinguish genuine learned structure from in-sample compression better than description length alone.",
                      "**H4 — Predictive and representational invariance.** Held-out primitive prediction, transfer, and intervention stability will distinguish genuine learned structure from in-sample compression better than description length alone. Distinct token registries that preserve these quantities should be functionally equivalent even when their boundaries and identifiers disagree."
                  ),
                  (
                      "The framework is also compatible with self-tokenizing teaching: learning a registry or code is one form of reducing opacity, and later token reuse is a concrete mechanism by which previously transmitted structure can become increasingly accessible.",
                      "The framework is also compatible with self-tokenizing teaching: learning a registry or code is one form of reducing opacity, and later token reuse is a concrete mechanism by which previously transmitted structure can become increasingly accessible. The primitive prediction substrate need not change when the symbolic scale changes; a learner may continue predicting the next bit while using whatever context-adapted hierarchy of tokens best supports that prediction and the target task."
                  ),
                  (
                      "> Optimal pedagogy is structured irregularity made progressively decodable; optimal learning is the extraction of predictive invariants from the mixture of signal, opacity, and noise.",
                      "> Optimal pedagogy is structured irregularity made progressively decodable; optimal learning is the extraction of predictive invariants from the mixture of signal, opacity, and noise. Primitive observations supply the evidence, while tokens are adaptive instruments whose value is earned by future prediction and competence."
                  ),
              ])
              Path('.github/workflows/clarify-bit-substrate-241.yml').unlink(missing_ok=True)

          elif pr == 238:
              revise('informational_time.md', [
                  (
                      "The framework distinguishes causal time from representational time. A long causal history may be replaced by a short symbolic index without erasing the events that occurred, provided the index retains an executable expansion proof. This motivates **recursive endogenous tokenization**: sequences of primitive marks become tokens; sequences of token indices become higher-order tokens; and the process continues until no admissible registration reduces the combined cost of the registry and the indexed transcript. The endpoint is a registry-relative irreducible residue, not an absolute computable incompressible core.",
                      "The framework distinguishes causal time from representational time. A long causal history may be replaced by a short symbolic index without erasing the events that occurred, provided the index retains an executable expansion proof. This motivates **recursive endogenous tokenization**: sequences of primitive marks become tokens; sequences of token indices become higher-order tokens; and the process continues until no admissible registration reduces the combined cost of the registry and the indexed transcript. These tokens are observer-relative, context-adaptive instruments. They do not replace the primitive physical stream or become mandatory external prediction targets. The endpoint is a registry-relative irreducible residue, not an absolute computable incompressible core."
                  ),
                  (
                      "The motivating companion framework, developed in `generative_machine_teaching.md`, introduces a self-tokenizing language in which concatenation is the only primitive operation. A demonstrated construction receives a stable index and an executable proof, allowing later procedures to use the construction as one symbol. The present paper asks what follows when that mechanism is applied recursively to causal histories themselves.",
                      "The motivating companion framework, developed in `generative_machine_teaching.md`, introduces a self-tokenizing language in which concatenation is the only primitive operation. In its strict track, the learner remains externally evaluated on the primitive bit stream, while a demonstrated construction may receive a stable index and executable proof so that later inference can use it as one internal symbol. The present paper asks what follows when that adaptive representational mechanism is applied recursively to causal histories themselves."
                  ),
                  (
                      "- that a short token makes the causal history it denotes cease to have occurred.",
                      "- that a short token makes the causal history it denotes cease to have occurred;\n- that one registry, segmentation, or token hierarchy is uniquely correct independently of observer, context, and predictive task."
                  ),
                  (
                      "Begin with a physical alphabet:\n\n$$\n\\Sigma_0=\\{0,1\\}.\n$$\n\nAfter registering useful strings over $\\Sigma_0$, obtain a symbolic alphabet $\\Sigma_1$.",
                      "Begin with a physical alphabet:\n\n$$\n\\Sigma_0=\\{0,1\\}.\n$$\n\nThe primitive observable interface remains at this level. In a binary prediction benchmark, the learner may be scored throughout on $p(b_{t+1}\\mid b_{1:t})$ even while it constructs higher symbolic levels internally. After registering useful strings over $\\Sigma_0$, obtain a symbolic alphabet $\\Sigma_1$."
                  ),
                  (
                      "A token may be worthwhile even when it does not compress the past if it substantially reduces expected future teaching, prediction, or action cost.",
                      "A token may be worthwhile even when it does not compress the past if it substantially reduces expected future teaching, primitive prediction, or action cost. Its legitimacy is functional and context-dependent: another registry may be equally good if it yields comparable observable predictions, competence, transfer, and total cost."
                  ),
                  (
                      "Let $Y$ be the future variable, target action, or task output whose prediction matters. Define predictive semantic yield:",
                      "Let $Y$ be the future variable, target action, primitive next observation, or task output whose prediction matters. For a binary stream, $Y$ may simply be $b_{t+1}$. Define predictive semantic yield:"
                  ),
                  (
                      "A shared token is evidence that:\n\n1. a structure recurred or transformed systematically;\n2. the demonstrator used it as a unit;\n3. the observer identified and registered it;\n4. later interaction successfully reused the index.\n\nTokens therefore mark accumulated predictive coordination, not merely static compression.",
                      "A shared token is one possible record that:\n\n1. a structure recurred or transformed systematically;\n2. the demonstrator used it as a unit;\n3. the observer identified and registered it;\n4. later interaction successfully reused the index.\n\nTokens therefore can mark accumulated predictive coordination, not merely static compression. They are not the only possible record: observers may construct different, functionally equivalent registries, and coordination must ultimately be evaluated at the primitive observation and action interfaces."
                  ),
                  (
                      "Allow tokens at level $k$ to become atoms for candidate tokens at level $k+1$. Measure:\n\n- total registry cost;\n- indexed transcript length;\n- proof depth;\n- causal history recovery;\n- compression fixed points;\n- predictive yield;\n- transfer to larger unseen structures.",
                      "Allow tokens at level $k$ to become atoms for candidate tokens at level $k+1$. Keep the primitive bit or observation prediction interface fixed across conditions. Measure:\n\n- total registry cost;\n- indexed transcript length;\n- proof depth;\n- causal history recovery;\n- primitive predictive loss;\n- functional equivalence among alternative registries;\n- compression fixed points;\n- predictive yield;\n- transfer to larger unseen structures."
                  ),
                  (
                      "Proof-preserving tokenization can replace long histories with short indices without erasing the event order that produced them. Because indices can themselves be concatenated and registered, tokenization becomes recursive. The process continues until the combined registry and transcript reach a relative fixed point under the admitted construction language and cost function.",
                      "Proof-preserving tokenization can replace long histories with short indices without erasing the event order that produced them. Because indices can themselves be concatenated and registered, tokenization becomes recursive. The physical evidence nevertheless remains the primitive stream; the hierarchy is an adaptive representational strategy whose value is measured by prediction, action, reconstruction, and cost. The process continues until the combined registry and transcript reach a relative fixed point under the admitted construction language and cost function."
                  ),
                  (
                      "The central empirical question is not whether a long sequence is improbable. It is whether interaction produces a proof-preserving representation that compresses what has occurred, predicts what comes next, and does so after the full cost of the representation itself is paid.",
                      "The central empirical question is not whether a long sequence is improbable or whether one canonical tokenization is recovered. It is whether interaction produces a proof-preserving representation that compresses what has occurred, improves prediction at the primitive interface, supports action and transfer, and does so after the full cost of the representation itself is paid."
                  ),
              ])
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "paper: make primitive prediction and adaptive tokenization explicit"
          git push origin HEAD:"$HEAD_REF"
