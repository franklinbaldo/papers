name: Semantic Atlas DGCT v1

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: experiments/semantic_atlas
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[models]'
      - name: Run frozen Dynamic Gauge Compression Test v1
        run: python scripts/run_dynamic_gauge_compression.py
      - uses: actions/upload-artifact@v4
        with:
          name: semantic-atlas-dgct-v1
          path: experiments/semantic_atlas/artifacts/dynamic_gauge_compression_v1.json
          if-no-files-found: error
