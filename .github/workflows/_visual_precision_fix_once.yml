name: One-shot diagram precision fix

on:
  push:
    branches:
      - docs/visual-round-20260917-19

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/visual-round-20260917-19
          fetch-depth: 0
      - name: Refine three diagram labels
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: anchor count={text.count(old)}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "structural_identification_from_restricted_truths.md",
              """    G -- One: [A] --> I[Target identified up to ~]\n    G -- More than one --> U[Structurally unresolved]""",
              """    G -->|One target class| I[Target identified up to ~]\n    G -->|Multiple classes| U[Structurally unresolved]""",
          )

          replace_once(
              "semantic_atlas_manifolds.md",
              """The split is load-bearing: the SRF locates conceptual regions globally, while chart coordinates and support geometry describe motion inside them. Neither branch is claimed to be sufficient by itself, and the original point-space Atlas remains the matched baseline.""",
              """The split is load-bearing: the SRF locates conceptual regions globally, while chart coordinates and support geometry describe motion inside them. Neither branch is claimed to be sufficient by itself; the testable object is their coordinated contribution to prediction, routing, and control.""",
          )

          replace_once(
              "paper1F_reputacao_sistema_juridico.md",
              """    P[Proxies observáveis<br/>afiliação · histórico · titulação · network] --> R[Reputação esperada]\n    D --> R\n    R --> T[Atenção, confiança e resposta<br/>na interação jurídica]\n\n    C[Redução tecnológica do custo<br/>de verificações textuais identificáveis] --> D\n    C -. pode reduzir peso relativo .-> P\n    D --> L[Qualidade observada repetidamente<br/>no canal local]""",
              """    P[Proxies observáveis<br/>afiliação · histórico · titulação · network] --> W[Peso atribuído<br/>ao canal reputacional]\n    W --> R[Reputação esperada]\n    D --> R\n    R --> T[Atenção, confiança e resposta<br/>na interação jurídica]\n\n    C[Redução tecnológica do custo<br/>de verificações textuais identificáveis] --> D\n    C -. pode reduzir .-> W\n    D --> L[Qualidade observada repetidamente<br/>no canal local]""",
          )
          PY
      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          rm .github/workflows/_visual_precision_fix_once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper1F_reputacao_sistema_juridico.md semantic_atlas_manifolds.md structural_identification_from_restricted_truths.md .github/workflows/_visual_precision_fix_once.yml
          git diff --cached --check
          git commit -m "docs: tighten diagram semantics"
          git push origin HEAD:docs/visual-round-20260917-19
