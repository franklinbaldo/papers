name: Pontifex CMB matched-null robustness

on:
  pull_request:
    paths:
      - "experiments/pontifex_torus/cmb_matched_null_robustness_ladder.py"
      - ".github/workflows/pontifex-cmb-matched-null-robustness.yml"
  workflow_dispatch:
    inputs:
      trials:
        description: "Monte Carlo trials per family/null-count cell"
        required: false
        default: "100000"

jobs:
  robustness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Run matched-null robustness ladder
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TRIALS=50000
          else
            TRIALS="${{ github.event.inputs.trials || '100000' }}"
          fi
          uv run experiments/pontifex_torus/cmb_matched_null_robustness_ladder.py \
            --null-counts 4 8 16 32 64 128 \
            --families gaussian student_t5 lognormal contaminated_gaussian \
            --trials "$TRIALS" \
            --output /tmp/pontifex-cmb-matched-null-robustness.json

      - name: Summarize
        if: always()
        run: |
          if [ -f /tmp/pontifex-cmb-matched-null-robustness.json ]; then
            echo "## CMB matched-null robustness ladder" >> "$GITHUB_STEP_SUMMARY"
            echo '~~~json' >> "$GITHUB_STEP_SUMMARY"
            python -c 'import json; x=json.load(open("/tmp/pontifex-cmb-matched-null-robustness.json")); print(json.dumps(x["headline"], indent=2))' >> "$GITHUB_STEP_SUMMARY"
            echo '~~~' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pontifex-cmb-matched-null-robustness
          path: /tmp/pontifex-cmb-matched-null-robustness.json
          if-no-files-found: warn
