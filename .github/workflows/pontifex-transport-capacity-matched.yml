name: Pontifex capacity-matched transport ablation

on:
  pull_request:
    paths:
      - "experiments/pontifex_torus/transport_capacity_matched_ablation.py"
      - "experiments/pontifex_torus/transport_bottleneck_ablation.py"
      - "experiments/pontifex_torus/virtual_resolution.py"
      - "experiments/pontifex_torus/build_field_store.py"
      - ".github/workflows/pontifex-transport-capacity-matched.yml"
  workflow_dispatch:

jobs:
  ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FIELD_STORE: .cache/pontifex-scale/field-2000-size1-allstarts-17.npz

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Restore 2k-text one-lens field
        id: field-cache
        uses: actions/cache@v4
        with:
          path: .cache/pontifex-scale
          key: pontifex-scale-v1-2000-size1-17-${{ hashFiles('experiments/pontifex_torus/build_field_store.py') }}

      - name: Restore encoder weights on cold build
        if: steps.field-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: pontifex-models-v1-${{ runner.os }}
          restore-keys: |
            pontifex-models-v1-${{ runner.os }}
            pontifex-torus-${{ runner.os }}-
            pontifex-red1-${{ runner.os }}-

      - name: Build 2k-text one-lens field on cache miss
        if: steps.field-cache.outputs.cache-hit != 'true'
        run: |
          uv run experiments/pontifex_torus/build_field_store.py \
            --texts 2000 \
            --positions 32 \
            --sizes 1 \
            --seed 17 \
            --output "$FIELD_STORE"

      - name: Run capacity-matched nonlinear transport ablation
        run: |
          uv run experiments/pontifex_torus/transport_capacity_matched_ablation.py \
            --field-store "$FIELD_STORE" \
            --seeds 0 1 2 \
            --real-probes 8 \
            --virtual-steps 128 \
            --dense-train-grid 512 \
            --harmonics 8 \
            --anchors 256 \
            --alphas 0.1 1 10 \
            --rff-gammas 0.01 0.1 1 \
            --mlp-alphas 0.0001 0.001 0.01 \
            --mlp-max-iter 350 \
            --output /tmp/pontifex-transport-capacity-matched.json

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pontifex-transport-capacity-matched
          path: /tmp/pontifex-transport-capacity-matched.json
          if-no-files-found: error
