name: Temporary Semantic Atlas paper patch

on:
  push:
    branches:
      - semantic-atlas/01-paper

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: semantic-atlas/01-paper
      - name: Patch weight-derived dynamics claims
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('semantic_atlas.md')
          text = path.read_text()

          old = '''### 8.2 Local dynamic operators

Within a sufficiently small semantic cell \\(c\\), approximate the dynamics by

\\[
q_{t+1}\\approx A_cq_t+B_cu_t+b_c.
\\]

If this approximation remains valid over multiple steps, then coarse planning can use operator composition rather than lexical simulation:

\\[
q_{t+n}\\approx A_c^nq_t+\\sum_{j=0}^{n-1}A_c^jb_c.
\\]

This is the strongest efficiency hypothesis in the programme. It would allow the planner to jump across semantic time at coarse resolution and invoke token-level generation only when required. It is also the easiest hypothesis to falsify if local linear models rapidly lose predictive accuracy.'''

          new = '''### 8.2 Weight-derived local dynamic operators

A local affine model fitted from observed transitions,

\\[
q_{t+1}\\approx A_cq_t+B_cu_t+b_c,
\\]

can be a useful reduced-order model, but it is **empirical atlas compression**, not dynamic compilation from weights. The weight-compilation claim requires a predictor that exists before fitting on \\((q_t,q_{t+1})\\) trajectory pairs.

The v0 weight-derived operator therefore linearizes a differentiable frozen-model semantic transition. For a fixed prefix, the transformer produces next-token logits; those logits define a soft expected next-token embedding; one additional frozen transformer step maps that relaxed token to a next hidden state; and a frozen projection maps that state into the SRF. If this composite map is \\(G_M\\), autograd supplies

\\[
J_M^{weight}=\\frac{\\partial G_M}{\\partial e_t},
\\]

where \\(e_t\\) is the final input embedding at the prefix anchor. Locally,

\\[
G_M(e_t+\\delta e)\\approx G_M(e_t)+J_M^{weight}\\delta e.
\\]

This operator is genuinely parameter-derived: its construction uses frozen model weights and the frozen SRF projection, but no empirical next-state pairs. The soft-token relaxation is only an approximation to discrete generation, so its scientific value depends on whether its directions predict held-out **observed** SRF transitions better than matched random Jacobians and output-head-only baselines.

Observed transitions remain useful as a separate baseline: fit empirical \\(A_c,b_c\\), compare its prediction horizon with the zero-trajectory weight Jacobian, then add empirical residual calibration incrementally. A later empirical fit cannot retroactively count as evidence for weight-derived dynamics.

If a weight-derived operator remains predictive over useful neighborhoods, coarse planning may eventually compose local operators instead of simulating every lexical step. If it loses predictive value immediately, the dynamic compilation hypothesis fails even if output-head SVD remains useful lexical compression.'''

          if old not in text:
              raise SystemExit('missing section 8.2 fragment')
          text = text.replace(old, new, 1)

          old = '''### 9.5 Experiment D: compiled atlas

Decompose the output head at multiple ranks and measure:

- top-k logit overlap;
- KL between full and low-rank output distributions;
- neighborhood preservation in lexical space;
- correlation between compiled and empirical atlas transitions.

Then add a sparse set of local Jacobians/activations and measure the marginal improvement. Random low-rank bases are required controls.'''

          new = '''### 9.5 Experiment D: compiled lexical and dynamic structure

First decompose the output head at multiple ranks and measure top-k logit overlap, KL between full and low-rank output distributions, and neighborhood preservation in lexical space. This establishes only lexical weight-space compression.

Separately, compile the frozen-transformer \\(J_M^{weight}\\) operator described above at registered prefixes **without fitting empirical transition pairs**. Compare its predicted SRF directions with held-out discrete transitions and with random Jacobians matched for dimension and norm. Then fit empirical local linear dynamics as a named baseline and add increasing fractions of empirical residual calibration to the weight-derived operator.

The zero-trajectory point is load-bearing: if prediction appears only after fitting \\(A_c,b_c\\) on observed transitions, Experiment D supports empirical reduced dynamics but not dynamic atlas compilation from weights.'''

          if old not in text:
              raise SystemExit('missing experiment D fragment')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Commit paper correction
        run: |
          if git diff --quiet -- semantic_atlas.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add semantic_atlas.md
          git commit -m "fix(paper): separate weight Jacobians from empirical dynamics"
          git push origin HEAD:semantic-atlas/01-paper
