name: Pontifex acquisition x topology short control

on:
  pull_request:
    paths:
      - "experiments/pontifex_torus/acquisition_topology_curve.py"
      - ".github/workflows/pontifex-acquisition-topology-short-control.yml"
  workflow_dispatch:

jobs:
  curve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FIELD_STORE: .cache/pontifex-scale/field-2000-size1-allstarts-17.npz

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Restore 2k-text one-lens field
        id: field-cache
        uses: actions/cache@v4
        with:
          path: .cache/pontifex-scale
          key: pontifex-scale-v1-2000-size1-17-${{ hashFiles('experiments/pontifex_torus/build_field_store.py') }}

      - name: Restore encoder weights on cold build
        if: steps.field-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: pontifex-models-v1-${{ runner.os }}
          restore-keys: |
            pontifex-models-v1-${{ runner.os }}
            pontifex-torus-${{ runner.os }}-
            pontifex-red1-${{ runner.os }}-

      - name: Build field only if cache unexpectedly misses
        if: steps.field-cache.outputs.cache-hit != 'true'
        run: |
          uv run experiments/pontifex_torus/build_field_store.py \
            --texts 2000 \
            --positions 32 \
            --sizes 1 \
            --seed 17 \
            --output "$FIELD_STORE"

      - name: Run low-K control on the original short corpus
        run: |
          uv run experiments/pontifex_torus/acquisition_topology_curve.py \
            --field-store "$FIELD_STORE" \
            --seeds 0 1 2 \
            --real-probes 2 4 6 8 \
            --virtual-steps 128 \
            --dense-train-grid 512 \
            --harmonics 8 \
            --anchors 256 \
            --edge-budget 36 \
            --random-reps 12 \
            --alphas 0.1 1 10 \
            --output /tmp/pontifex-acquisition-topology-short-control.json

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pontifex-acquisition-topology-short-control
          path: /tmp/pontifex-acquisition-topology-short-control.json
          if-no-files-found: error
