name: Pontifex acquisition x topology curve

on:
  pull_request:
    paths:
      - "experiments/pontifex_torus/build_long_field_store.py"
      - "experiments/pontifex_torus/acquisition_topology_curve.py"
      - "experiments/pontifex_torus/interaction_topology_ablation.py"
      - "experiments/pontifex_torus/quadratic_term_ablation.py"
      - "experiments/pontifex_torus/transport_bottleneck_ablation.py"
      - "experiments/pontifex_torus/virtual_resolution.py"
      - ".github/workflows/pontifex-acquisition-topology-curve.yml"
  workflow_dispatch:

jobs:
  curve:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FIELD_STORE: .cache/pontifex-long-topology/field-800-c4-p32-seed29.npz

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Restore longer-input field
        id: field-cache
        uses: actions/cache@v4
        with:
          path: .cache/pontifex-long-topology
          key: pontifex-long-topology-v1-800-c4-p32-29-${{ hashFiles('experiments/pontifex_torus/build_long_field_store.py') }}

      - name: Restore encoder weights on cold build
        if: steps.field-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: pontifex-models-v1-${{ runner.os }}
          restore-keys: |
            pontifex-models-v1-${{ runner.os }}
            pontifex-torus-${{ runner.os }}-
            pontifex-red1-${{ runner.os }}-

      - name: Build longer-input field on cache miss
        if: steps.field-cache.outputs.cache-hit != 'true'
        run: |
          uv run experiments/pontifex_torus/build_long_field_store.py \
            --texts 800 \
            --positions 32 \
            --clauses 4 \
            --seed 29 \
            --output "$FIELD_STORE"

      - name: Run acquisition x topology curve
        run: |
          uv run experiments/pontifex_torus/acquisition_topology_curve.py \
            --field-store "$FIELD_STORE" \
            --seeds 0 1 2 \
            --real-probes 4 6 8 10 12 16 24 \
            --virtual-steps 128 \
            --dense-train-grid 512 \
            --harmonics 8 \
            --anchors 128 \
            --edge-budget 36 \
            --random-reps 10 \
            --alphas 0.1 1 10 \
            --output /tmp/pontifex-acquisition-topology-curve.json

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pontifex-acquisition-topology-curve
          path: /tmp/pontifex-acquisition-topology-curve.json
          if-no-files-found: error
