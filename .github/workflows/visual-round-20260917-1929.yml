name: Visual improvement round 2026-09-17 1929

on:
  push:
    branches: ["docs/visual-round-20260917-1929"]
    paths:
      - ".github/workflows/visual-round-20260917-1929.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: docs/visual-round-20260917-1929

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Add five scientific visual interventions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def insert_after(path: str, anchor: str, addition: str, marker: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if marker in text:
                  return
              if anchor not in text:
                  raise SystemExit(f"anchor not found in {path}: {anchor[:80]!r}")
              p.write_text(text.replace(anchor, anchor + addition, 1), encoding="utf-8")

          # 1) STT: separate the offline/frozen semantic interface from the trainable model and grounded decoder.
          insert_after(
              "semantic_tokenization_transformers.md",
              "Our method consists of three main stages: (1) offline semantic tokenization to create the codebook and convert the corpus, (2) Transformer pre-training on semantic codes, and (3) faithful decoding for text reconstruction. We describe each stage in detail.\n\n",
              "The architecture is easiest to audit when the fixed semantic interface is separated from the trainable sequence model and from the reconstruction path. The figure shows where information is transformed, which components are fit offline or frozen, and how predicted codes return to text through corpus-grounded exemplars rather than unconstrained generation.\n\n"
              "```mermaid\n"
              "flowchart LR\n"
              "    D[Raw documents] --> C[Overlapping chunks]\n"
              "    C --> T[Teacher embedding model<br/>pre-trained and frozen]\n"
              "    T --> Q[RVQ quantizer<br/>fit offline]\n"
              "    Q --> S[Semantic code sequences]\n"
              "    Q --> M[Medoid index<br/>real corpus chunks]\n"
              "    S --> X[Semantic Transformer<br/>trainable]\n"
              "    X --> P[Predicted semantic codes]\n"
              "    P --> R[Retrieve medoid candidates]\n"
              "    M --> R\n"
              "    R --> V[Path selection +<br/>overlap merge]\n"
              "    V --> N[Disciplined normalization<br/>surface editing only]\n"
              "    N --> O[Reconstructed text]\n"
              "```\n\n"
              "This separation is scientifically load-bearing: sequence compression and code prediction can be evaluated independently of reconstruction quality, while reconstruction errors can be localized to retrieval, path selection, merging, or normalization.\n\n",
              "The architecture is easiest to audit when the fixed semantic interface",
          )

          # 2) Structured Irregularity: operationalize retrospective interpretation as an ablation test.
          insert_after(
              "pedagogical_signal_extraction.md",
              "This captures layered knowledge formation: first the learner acquires the protocol, then the protocol unlocks the code, and the decoded layer supports acquisition of the target function.\n\n",
              "Retrospective interpretation is therefore an operational claim about the later model, not a visual judgment that an earlier event merely looks meaningful in hindsight. The decisive test removes the earlier observation only after the later decoding structure exists and asks whether held-out performance worsens.\n\n"
              "```mermaid\n"
              "flowchart LR\n"
              "    Z[Earlier observation z_i<br/>little immediate gain] --> H[Later demonstrations]\n"
              "    H --> R[Protocol or representation<br/>becomes available]\n"
              "    R --> A[Ablate z_i from the<br/>same completed history]\n"
              "    A --> G{Held-out loss increases<br/>without z_i?}\n"
              "    G -- Yes --> O[Retrospective gain R_i,t > 0<br/>temporary opacity supported]\n"
              "    G -- No --> U[No retrospective support<br/>noise / coincidence / unresolved]\n"
              "```\n\n"
              "The figure keeps the evidentiary direction explicit: later structure licenses a new test of earlier evidence, but does not by itself relabel that evidence as signal.\n\n",
              "Retrospective interpretation is therefore an operational claim",
          )

          # 3) Driver rehosting: make the two distinct SystemBuffer boundaries visible.
          insert_after(
              "contract_aware_driver_rehosting.md",
              "With input length 64 and output length 8, a 32-byte write may remain inside the allocation while crossing\nthe declared output boundary. A trailing guard page alone cannot observe that\ncrossing.\n\n",
              "The two bounds answer different questions. The physical allocation answers whether the write is memory-safe in the synthetic buffer; the caller-declared output length answers whether the write crosses the semantic output boundary. The example below shows why those predicates can disagree without yet proving an overrun.\n\n"
              "```mermaid\n"
              "flowchart LR\n"
              "    I[InputBufferLength = 64] --> N[SystemBuffer allocation<br/>N = max(input, output) = 64]\n"
              "    O[OutputBufferLength = 8] --> N\n"
              "    W[Observed write<br/>interval 0..32] --> P{Within physical allocation<br/>0..64?}\n"
              "    P -- No --> F[PHYSICAL_OVERFLOW]\n"
              "    P -- Yes --> D{Within declared output<br/>0..8?}\n"
              "    D -- Yes --> K[Within both bounds]\n"
              "    D -- No --> E[DECLARED_OUTPUT_BOUNDARY_CROSSING<br/>E0 sensor event]\n"
              "    N --> P\n"
              "```\n\n"
              "A guard page can detect the `PHYSICAL_OVERFLOW` branch, but not the E0 branch; promotion of E0 to `OUTPUT_OVERRUN` still requires the independent output-intent evidence described below.\n\n",
              "The two bounds answer different questions.",
          )

          # 4) ESHTR: isolate the Semantic Proximity Hypothesis as a matched experimental contrast.
          insert_after(
              "embedding_seeded_tournament.md",
              "**Hypothesis test:** We expect κ_intracluster > κ_crosscorpus\n(supporting the Semantic Proximity Hypothesis), with the\ndifference most pronounced for semantically distant cluster\npairs.\n\n",
              "The hypothesis is testable as a matched contrast rather than as a comparison of two different judging systems. Corpus, judge panel, rubric, randomization policy, and comparison budget remain fixed; only the semantic relationship of the sampled pair changes. Fleiss' κ is the primary endpoint, with non-transitive-cycle incidence as a secondary diagnostic.\n\n"
              "```mermaid\n"
              "flowchart TD\n"
              "    C[Same held-out judicial corpus] --> I[Sample intra-cluster pairs]\n"
              "    C --> X[Sample cross-cluster pairs]\n"
              "    K[Held constant:<br/>judge panel + rubric +<br/>position randomization + budget] --> I\n"
              "    K --> X\n"
              "    I --> MI[Measure κ_intra<br/>and cycle incidence]\n"
              "    X --> MX[Measure κ_cross<br/>and cycle incidence]\n"
              "    MI --> T{Pre-registered contrast}\n"
              "    MX --> T\n"
              "    T --> S[Support SPH if<br/>κ_intra > κ_cross]\n"
              "    T --> F[No support / falsification if<br/>κ_intra ≤ κ_cross after controls]\n"
              "```\n\n"
              "This design prevents clustering quality itself from being mistaken for judicial quality: clustering determines the comparison regime, while the unchanged panel supplies the quality judgments.\n\n",
              "The hypothesis is testable as a matched contrast rather than",
          )

          # 5) Argumentative costs: expose why the low-quality equilibrium survives unilateral cooperation.
          insert_after(
              "paper1E_custos_argumentativos.md",
              "A assimetria de benefícios e custos mantém o equilíbrio (β, β)\nmesmo que todos os agentes reconheçam que (α, α) seria melhor\npara o sistema.\n\n",
              "A estabilidade desse equilíbrio depende do custo do **desvio unilateral**: se apenas um lado passa a investir em argumentação robusta, ele internaliza o custo presente sem capturar sozinho o benefício sistêmico da coordenação. A figura separa essa tese qualitativa da hipótese posterior, na seção 4, de que a redução tecnológica de custos pode alterar os payoffs.\n\n"
              "```mermaid\n"
              "flowchart TD\n"
              "    B[Equilíbrio atual β,β<br/>baixo esforço dos dois lados]\n"
              "    B --> I[Órgão inferior muda sozinho para α<br/>custo concentrado + benefício incerto]\n"
              "    B --> S[STF muda sozinho para α<br/>custo presente + pouco retorno<br/>se a aplicação segue mecânica]\n"
              "    I --> RI[Incentivo individual<br/>a retornar para β]\n"
              "    S --> RS[Incentivo institucional<br/>a retornar para β]\n"
              "    B -. coordenação ou payoffs alterados .-> A[Estado α,α<br/>diálogo racional]\n"
              "```\n\n"
              "O diagrama não atribui valores numéricos aos payoffs; ele explicita apenas a estrutura de incentivos defendida nesta seção e deixa para a seção 4 a questão de quando a redução de custos pode deslocar o equilíbrio.\n\n",
              "A estabilidade desse equilíbrio depende do custo do **desvio unilateral**",
          )

          # Basic documentation/diagram sanity checks.
          targets = [
              "semantic_tokenization_transformers.md",
              "pedagogical_signal_extraction.md",
              "contract_aware_driver_rehosting.md",
              "embedding_seeded_tournament.md",
              "paper1E_custos_argumentativos.md",
          ]
          for path in targets:
              text = Path(path).read_text(encoding="utf-8")
              if text.count("```mermaid") > text.count("```") // 2:
                  raise SystemExit(f"unbalanced fenced blocks in {path}")
          PY

      - name: Validate OKF frontmatter
        run: |
          pip install pyyaml
          python3 okf/validate.py

      - name: Verify intervention set
        run: |
          git diff --check
          git diff --stat
          test "$(git diff --name-only -- '*.md' | wc -l)" -eq 5
          grep -n "The architecture is easiest to audit" semantic_tokenization_transformers.md
          grep -n "Retrospective interpretation is therefore" pedagogical_signal_extraction.md
          grep -n "The two bounds answer different questions" contract_aware_driver_rehosting.md
          grep -n "The hypothesis is testable as a matched contrast" embedding_seeded_tournament.md
          grep -n "A estabilidade desse equilíbrio depende" paper1E_custos_argumentativos.md

      - name: Commit visual round and remove staging workflow
        run: |
          rm .github/workflows/visual-round-20260917-1929.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: add five scientific visual explanations"
          git push origin HEAD:docs/visual-round-20260917-1929
