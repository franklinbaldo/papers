name: Structural identification Lean proofs

on:
  pull_request:
    paths:
      - 'structural-identification/restricted-truths.md'
      - 'structural-identification/formalizations/**'
      - '.github/workflows/structural-identification-lean.yml'
  push:
    branches:
      - 'paper/structural-identification-lean'
    paths:
      - 'structural-identification/restricted-truths.md'
      - 'structural-identification/formalizations/**'
      - '.github/workflows/structural-identification-lean.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y

      - name: Install Lean 4.22.0
        run: |
          "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.22.0

      - name: Check structural-identification proofs
        run: |
          "$HOME/.elan/bin/elan" run leanprover/lean4:v4.22.0 \
            lean structural-identification/formalizations/StructuralIdentification.lean
