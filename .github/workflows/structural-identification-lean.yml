name: Lean formalizations

on:
  pull_request:
    paths:
      - "formalizations/**"
      - "scripts/check_lean_formalizations.py"
      - "lean-toolchain"
      - ".github/workflows/structural-identification-lean.yml"
      - "pontifex_torus.md"
      - "structural_identification_from_restricted_truths.md"
  push:
    branches:
      - main
      - "experiment/pontifex-red-1"
      - "paper/structural-identification-lean"
    paths:
      - "formalizations/**"
      - "scripts/check_lean_formalizations.py"
      - "lean-toolchain"
      - ".github/workflows/structural-identification-lean.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install uv
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install elan
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh |
            sh -s -- -y --no-modify-path

      - name: Install pinned Lean
        shell: bash
        run: |
          set -euo pipefail
          TOOLCHAIN="$(tr -d '\r\n' < lean-toolchain)"
          "$HOME/.elan/bin/elan" toolchain install "$TOOLCHAIN"
          "$HOME/.elan/bin/elan" default "$TOOLCHAIN"
          "$HOME/.elan/bin/lean" --version

      - name: Compile and audit all Lean formalizations
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$HOME/.local/bin:$PATH"
          uv run scripts/check_lean_formalizations.py
