name: Semantic Atlas model-backed A

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: experiments/semantic_atlas
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[models]'
      - name: Run frozen model-backed Experiment A
        run: python scripts/run_model_backed_a.py
      - uses: actions/upload-artifact@v4
        with:
          name: semantic-atlas-model-backed-a-v1
          path: |
            experiments/semantic_atlas/artifacts/model_backed_a_v1.json
            experiments/semantic_atlas/artifacts/embedding_cache_v1/**
          if-no-files-found: error
