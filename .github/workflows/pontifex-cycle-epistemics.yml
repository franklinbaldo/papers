name: Pontifex cycle epistemics

on:
  pull_request:
    paths:
      - "experiments/pontifex_torus/cycle_epistemics.py"
      - "experiments/pontifex_torus/build_field_store.py"
      - "experiments/pontifex_torus/alignment_benchmark.py"
      - ".github/workflows/pontifex-cycle-epistemics.yml"
  workflow_dispatch:

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FIELD_STORE: .cache/pontifex-torus/field-120-8-17-embeddings.npz
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Restore field with original embeddings
        id: field-cache
        uses: actions/cache@v4
        with:
          path: .cache/pontifex-torus
          key: pontifex-field-emb-v1-120-8-17-${{ hashFiles('experiments/pontifex_torus/build_field_store.py') }}

      - name: Restore encoder weights on cold build
        if: steps.field-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: pontifex-models-v1-${{ runner.os }}
          restore-keys: |
            pontifex-torus-${{ runner.os }}-
            pontifex-red1-${{ runner.os }}-

      - name: Build field on cache miss
        if: steps.field-cache.outputs.cache-hit != 'true'
        run: |
          uv run experiments/pontifex_torus/build_field_store.py \
            --texts 120 \
            --positions 8 \
            --seed 17 \
            --output "$FIELD_STORE"

      - name: Run canonical torus / cycle residual experiment
        run: |
          uv run experiments/pontifex_torus/cycle_epistemics.py \
            --field-store "$FIELD_STORE" \
            --seeds 0 1 2 3 4 \
            --train-sizes 4 8 16 32 64 84 \
            --test-count 30 \
            --output /tmp/pontifex-cycle-epistemics.json

      - name: Publish result
        if: always()
        run: |
          if [ -f /tmp/pontifex-cycle-epistemics.json ]; then
            cat /tmp/pontifex-cycle-epistemics.json >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pontifex-cycle-epistemics
          path: /tmp/pontifex-cycle-epistemics.json
          if-no-files-found: error
