name: Semantic Atlas scale corpus harvest

on:
  push:
    branches:
      - experiment/semantic-atlas-scale-preregister
    paths:
      - ".github/workflows/semantic-atlas-scale-corpus.yml"
      - "experiments/semantic_atlas/scripts/harvest_arxiv_scale_corpus.py"
      - "experiments/semantic_atlas/scale_mknn_v1.json"
      - "experiments/semantic_atlas/protocol_scale_mknn.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tokenizer dependency
        run: python -m pip install --disable-pip-version-check "transformers>=4.51,<5"

      - name: Harvest and freeze corpus
        working-directory: experiments/semantic_atlas
        run: |
          python scripts/harvest_arxiv_scale_corpus.py \
            --output-dir artifacts/scale_corpus_v1

      - name: Commit content-addressed corpus
        run: |
          git config user.name "semantic-atlas-bot"
          git config user.email "semantic-atlas-bot@users.noreply.github.com"
          git add experiments/semantic_atlas/artifacts/scale_corpus_v1
          if git diff --cached --quiet; then
            echo "Corpus already frozen; no commit needed."
            exit 0
          fi
          git commit -m "data: freeze post-release arXiv 120k corpus"
          git push origin HEAD:experiment/semantic-atlas-scale-preregister

      - name: Upload corpus backup
        uses: actions/upload-artifact@v4
        with:
          name: semantic-atlas-scale-corpus-v1
          path: experiments/semantic_atlas/artifacts/scale_corpus_v1
          if-no-files-found: error
          retention-days: 90
