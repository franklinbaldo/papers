name: Pontifex SciFact classical baselines

on:
  pull_request:
    paths:
      - "experiments/pontifex_benchmarks/scifact_classical_baselines.py"
      - "experiments/pontifex_benchmarks/scifact_transport.py"
      - "experiments/pontifex_benchmarks/PROTOCOL-SCIFACT-CLASSICAL-BASELINES-2026-09-19.md"
      - ".github/workflows/pontifex-scifact-classical-baselines.yml"
  workflow_dispatch:

jobs:
  baselines:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Restore frozen SciFact representations
        uses: actions/cache@v4
        with:
          path: |
            .cache/pontifex-scifact
            ~/.cache/huggingface
          key: pontifex-scifact-classical-v1-${{ runner.os }}
          restore-keys: |
            pontifex-scifact-coupling-v1-
            pontifex-scifact-side-v1-
            pontifex-scifact-transport-v2-
            pontifex-scifact-transport-v1-

      - name: Run information-matched CCA PLS RFF baselines
        run: |
          uv run experiments/pontifex_benchmarks/scifact_classical_baselines.py \
            --budgets 16 32 64 128 256 512 \
            --seed 20260919 \
            --cache-dir .cache/pontifex-scifact \
            --output /tmp/pontifex-scifact-classical-baselines.json

      - name: Publish compact status
        if: always()
        run: |
          if [ -f /tmp/pontifex-scifact-classical-baselines.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('/tmp/pontifex-scifact-classical-baselines.json').read_text())
          print('leakage:', p['leakage_audit']['status'])
          print('A nDCG@10:', p['oracle_context']['A_only']['official']['ndcg_at_10'])
          print('B nDCG@10:', p['oracle_context']['B_oracle']['official']['ndcg_at_10'])
          for row in p['results_by_budget']:
              k = row['shared_correspondences_k']
              vals = {m: row['test'][m]['official']['ndcg_at_10'] for m in ('CCA','PLS','RFF_Ridge')}
              print('K', k, vals)
          print('frontier:', p['quality_matched_frontier_ndcg10'])
          PY
          fi

      - name: Upload baseline record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pontifex-scifact-classical-baselines
          path: /tmp/pontifex-scifact-classical-baselines.json
          if-no-files-found: error
