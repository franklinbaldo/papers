name: Pontifex CMB local-spectrum held-out test

on:
  pull_request:
    paths:
      - "experiments/pontifex_torus/cmb_local_spectrum_holdout.py"
      - ".github/workflows/pontifex-cmb-local-spectrum-holdout.yml"
  workflow_dispatch:
    inputs:
      dev_skies:
        description: "Development base skies"
        required: false
        default: "12"
      heldout_skies:
        description: "Held-out base skies"
        required: false
        default: "24"

jobs:
  local-spectrum-holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Run local-spectrum held-out test
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            DEV=12
            HELD=24
          else
            DEV="${{ github.event.inputs.dev_skies || '12' }}"
            HELD="${{ github.event.inputs.heldout_skies || '24' }}"
          fi
          uv run experiments/pontifex_torus/cmb_local_spectrum_holdout.py \
            --dev-skies "$DEV" \
            --heldout-skies "$HELD" \
            --theta-per-cell 2 \
            --bins 3 \
            --beam-width-ratios 0.125 0.25 0.5 1.0 \
            --baseline-width 0.5 \
            --metric-k0 4 8 16 \
            --ny 64 --nx 128 \
            --seed 20260920 \
            --rows /tmp/pontifex-cmb-local-spectrum-holdout.jsonl \
            --output /tmp/pontifex-cmb-local-spectrum-holdout.json

      - name: Summarize
        if: always()
        run: |
          if [ -f /tmp/pontifex-cmb-local-spectrum-holdout.json ]; then
            echo "## CMB local-spectrum held-out test" >> "$GITHUB_STEP_SUMMARY"
            echo '~~~json' >> "$GITHUB_STEP_SUMMARY"
            python -c 'import json; x=json.load(open("/tmp/pontifex-cmb-local-spectrum-holdout.json")); print(json.dumps({"descriptor_audit":x["descriptor_audit"],"frozen_rule":x["frozen_rule"],"heldout":x["heldout"]}, indent=2))' >> "$GITHUB_STEP_SUMMARY"
            echo '~~~' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pontifex-cmb-local-spectrum-holdout
          path: |
            /tmp/pontifex-cmb-local-spectrum-holdout.json
            /tmp/pontifex-cmb-local-spectrum-holdout.jsonl
          if-no-files-found: warn
