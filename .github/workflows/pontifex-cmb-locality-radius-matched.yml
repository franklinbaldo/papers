name: Pontifex CMB locality radius-matched control

on:
  pull_request:
    paths:
      - "experiments/pontifex_torus/cmb_locality_radius_matched.py"
      - "experiments/pontifex_torus/PAPER-ADDENDUM-CMB-LOCALITY-RADIUS-MATCHED-2026-09-19.md"
      - ".github/workflows/pontifex-cmb-locality-radius-matched.yml"
  workflow_dispatch:
    inputs:
      dev_skies:
        description: "Development base skies"
        required: false
        default: "12"
      heldout_skies:
        description: "Held-out base skies"
        required: false
        default: "24"

jobs:
  locality-radius-matched:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Run radius-matched locality control
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            DEV=12
            HELD=24
          else
            DEV="${{ github.event.inputs.dev_skies || '12' }}"
            HELD="${{ github.event.inputs.heldout_skies || '24' }}"
          fi
          uv run experiments/pontifex_torus/cmb_locality_radius_matched.py \
            --dev-skies "$DEV" \
            --heldout-skies "$HELD" \
            --theta-per-cell 40 \
            --bins 3 \
            --beam-width-ratios 0.125 0.25 0.5 1.0 \
            --baseline-width 0.5 \
            --metric-k0 4 8 16 \
            --remote-shifts 0.25 0.5 0.75 \
            --single-remote-shift 0.5 \
            --max-abs-log-radius 0.10 \
            --max-abs-log-aspect 0.70 \
            --aspect-weight 0.25 \
            --ny 64 --nx 128 \
            --seed 20260924 \
            --rows /tmp/pontifex-cmb-locality-radius-matched.jsonl \
            --output /tmp/pontifex-cmb-locality-radius-matched.json

      - name: Summarize
        if: always()
        run: |
          if [ -f /tmp/pontifex-cmb-locality-radius-matched.json ]; then
            echo "## CMB locality radius-matched control" >> "$GITHUB_STEP_SUMMARY"
            echo '~~~json' >> "$GITHUB_STEP_SUMMARY"
            python -c 'import json; x=json.load(open("/tmp/pontifex-cmb-locality-radius-matched.json")); print(json.dumps({"design":x["design"],"matched_balance":x["geometry"]["matched_balance"],"development":x["development"],"heldout":x["heldout"]}, indent=2))' >> "$GITHUB_STEP_SUMMARY"
            echo '~~~' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pontifex-cmb-locality-radius-matched
          path: |
            /tmp/pontifex-cmb-locality-radius-matched.json
            /tmp/pontifex-cmb-locality-radius-matched.jsonl
          if-no-files-found: warn
