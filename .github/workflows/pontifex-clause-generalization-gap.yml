name: Pontifex clause generalization-gap diagnostic

on:
  push:
    branches:
      - "experiment/pontifex-red-1"
    paths:
      - "experiments/pontifex_torus/clause_complexity_generalization_gap.py"
      - "experiments/pontifex_torus/PAPER-ADDENDUM-CLAUSE-GENERALIZATION-GAP-2026-09-18.md"
      - ".github/workflows/pontifex-clause-generalization-gap.yml"
  pull_request:
    paths:
      - "experiments/pontifex_torus/clause_complexity_generalization_gap.py"
      - "experiments/pontifex_torus/PAPER-ADDENDUM-CLAUSE-GENERALIZATION-GAP-2026-09-18.md"
      - "experiments/pontifex_torus/build_paired_clause_ladder.py"
      - "experiments/pontifex_torus/quadratic_term_ablation.py"
      - "experiments/pontifex_torus/virtual_resolution.py"
      - ".github/workflows/pontifex-clause-generalization-gap.yml"
  workflow_dispatch:

jobs:
  gap-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      STORE_DIR: .cache/pontifex-clause-ladder
      RESULT: /tmp/pontifex-clause-generalization-gap.json

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Restore paired field cache
        id: field-cache
        uses: actions/cache@v4
        with:
          path: .cache/pontifex-clause-ladder
          key: pontifex-clause-ladder-v1-n800-p8-seed20260918-${{ hashFiles('experiments/pontifex_torus/build_paired_clause_ladder.py') }}

      - name: Restore encoder weights on cache miss
        if: steps.field-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: pontifex-models-v1-${{ runner.os }}
          restore-keys: |
            pontifex-models-v1-${{ runner.os }}
            pontifex-torus-${{ runner.os }}-
            pontifex-red1-${{ runner.os }}-

      - name: Build paired ladder fields on cache miss
        if: steps.field-cache.outputs.cache-hit != 'true'
        run: |
          uv run experiments/pontifex_torus/build_paired_clause_ladder.py \
            --texts 800 \
            --positions 8 \
            --seed 20260918 \
            --output-dir "$STORE_DIR"

      - name: Run train-vs-held-out generalization diagnostic
        run: |
          uv run experiments/pontifex_torus/clause_complexity_generalization_gap.py \
            --store-dir "$STORE_DIR" \
            --texts 800 \
            --positions 8 \
            --field-seed 20260918 \
            --seeds 0 1 2 \
            --dense-train-grid 512 \
            --harmonics 8 \
            --anchors 256 \
            --alphas 0.1 1 10 30 100 300 1000 \
            --output "$RESULT"

      - name: Upload diagnostic result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pontifex-clause-generalization-gap
          path: /tmp/pontifex-clause-generalization-gap.json
          if-no-files-found: error
