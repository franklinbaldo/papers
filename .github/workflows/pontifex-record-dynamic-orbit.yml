name: Fix Pontifex dynamic orbit paper formatting

on:
  pull_request:
    paths:
      - .github/workflows/pontifex-record-dynamic-orbit.yml

permissions:
  contents: write

jobs:
  fix-paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/pontifex-red-1
      - name: Dedent dynamic-orbit section
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("pontifex_torus.md")
          text = path.read_text(encoding="utf-8")
          start_marker = "### 12.17.1 Dynamic toroidal wraparound orbit"
          end_marker = "### 12.18 First scale ladder: fixed regional capacity does not scale automatically"
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          block = text[start:end]
          lines = []
          for line in block.splitlines():
              if line.startswith("    "):
                  line = line[4:]
              lines.append(line)
          fixed = "\n".join(lines).rstrip() + "\n\n"
          text = text[:start] + fixed + text[end:]
          path.write_text(text, encoding="utf-8")
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pontifex_torus.md
          if git diff --cached --quiet; then
            echo "Paper formatting already clean"
            exit 0
          fi
          git commit -m "paper: fix dynamic orbit section formatting"
          git push origin HEAD:experiment/pontifex-red-1
