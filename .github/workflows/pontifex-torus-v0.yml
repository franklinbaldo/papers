name: Pontifex torus v0

on:
  pull_request:
    paths:
      - "experiments/pontifex_torus/**"
      - ".github/workflows/pontifex-torus-v0.yml"
  workflow_dispatch:
    inputs:
      texts:
        description: "Number of synthetic texts"
        required: false
        default: "200"
      positions:
        description: "Occlusion positions per text"
        required: false
        default: "12"

jobs:
  torus:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: pontifex-torus-${{ runner.os }}-${{ hashFiles('experiments/pontifex_torus/run.py') }}
          restore-keys: |
            pontifex-torus-${{ runner.os }}-
            pontifex-diversity-${{ runner.os }}-
            pontifex-red1-${{ runner.os }}-

      - name: Run torus smoke
        if: github.event_name == 'pull_request'
        run: |
          uv run experiments/pontifex_torus/run.py \
            --texts 80 \
            --positions 6 \
            --seed 7 \
            --output /tmp/pontifex-torus-v0.json

      - name: Run torus study
        if: github.event_name == 'workflow_dispatch'
        env:
          TEXTS: ${{ github.event.inputs.texts || '200' }}
          POSITIONS: ${{ github.event.inputs.positions || '12' }}
        run: |
          uv run experiments/pontifex_torus/run.py \
            --texts "$TEXTS" \
            --positions "$POSITIONS" \
            --seed 7 \
            --output /tmp/pontifex-torus-v0.json

      - name: Publish result
        if: always()
        run: |
          if [ -f /tmp/pontifex-torus-v0.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/pontifex-torus-v0.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pontifex-torus-v0
          path: /tmp/pontifex-torus-v0.json
          if-no-files-found: warn
