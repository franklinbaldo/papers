name: Pontifex torus v0

on:
  pull_request:
    paths:
      - "experiments/pontifex_torus/**"
      - ".github/workflows/pontifex-torus-v0.yml"
  workflow_dispatch:
    inputs:
      texts:
        description: "Number of synthetic texts"
        required: false
        default: "200"
      positions:
        description: "Occlusion positions per text"
        required: false
        default: "12"

jobs:
  torus:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: pontifex-torus-${{ runner.os }}-${{ hashFiles('experiments/pontifex_torus/*.py') }}
          restore-keys: |
            pontifex-torus-${{ runner.os }}-
            pontifex-diversity-${{ runner.os }}-
            pontifex-red1-${{ runner.os }}-

      - name: Resolve study size
        id: size
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "texts=${{ github.event.inputs.texts || '200' }}" >> "$GITHUB_OUTPUT"
            echo "positions=${{ github.event.inputs.positions || '12' }}" >> "$GITHUB_OUTPUT"
          else
            echo "texts=120" >> "$GITHUB_OUTPUT"
            echo "positions=8" >> "$GITHUB_OUTPUT"
          fi

      - name: Run torus map
        run: |
          uv run experiments/pontifex_torus/run.py \
            --texts "${{ steps.size.outputs.texts }}" \
            --positions "${{ steps.size.outputs.positions }}" \
            --seed 7 \
            --output /tmp/pontifex-torus-v0.json

      - name: Run active cartography
        run: |
          uv run experiments/pontifex_torus/active.py \
            --texts "${{ steps.size.outputs.texts }}" \
            --positions "${{ steps.size.outputs.positions }}" \
            --seed 7 \
            --random-repeats 8 \
            --output /tmp/pontifex-active-v0.json

      - name: Run context lens
        run: |
          uv run experiments/pontifex_torus/context_scale.py \
            --texts "${{ steps.size.outputs.texts }}" \
            --positions "${{ steps.size.outputs.positions }}" \
            --seed 7 \
            --output /tmp/pontifex-context-v0.json

      - name: Run sequential shared-space experiments
        run: |
          uv run experiments/pontifex_torus/sequential_shared.py \
            --texts "${{ steps.size.outputs.texts }}" \
            --positions "${{ steps.size.outputs.positions }}" \
            --seed 17 \
            --output /tmp/pontifex-sequential-shared.json

      - name: Publish results
        if: always()
        run: |
          for f in \
            /tmp/pontifex-torus-v0.json \
            /tmp/pontifex-active-v0.json \
            /tmp/pontifex-context-v0.json \
            /tmp/pontifex-sequential-shared.json \\
            /tmp/pontifex-pass-sweep.json; do
            if [ -f "$f" ]; then
              echo "## $(basename "$f")" >> "$GITHUB_STEP_SUMMARY"
              echo '~~~json' >> "$GITHUB_STEP_SUMMARY"
              cat "$f" >> "$GITHUB_STEP_SUMMARY"
              echo '~~~' >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pontifex-torus-v0
          path: |
            /tmp/pontifex-torus-v0.json
            /tmp/pontifex-active-v0.json
            /tmp/pontifex-context-v0.json
            /tmp/pontifex-sequential-shared.json
            /tmp/pontifex-pass-sweep.json
          if-no-files-found: warn
