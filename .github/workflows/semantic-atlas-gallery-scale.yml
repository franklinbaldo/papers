name: Semantic Atlas gallery-scale gate

on:
  pull_request:
    paths:
      - "experiments/semantic_atlas/gallery_scale_v1.json"
      - "experiments/semantic_atlas/protocol_gallery_scale_v1.md"
      - "experiments/semantic_atlas/src/semantic_atlas/gallery_scale.py"
      - "experiments/semantic_atlas/src/semantic_atlas/embedding_cache.py"
      - "experiments/semantic_atlas/src/semantic_atlas/relational_dynamics.py"
      - "experiments/semantic_atlas/scripts/run_gallery_scale.py"
      - "experiments/semantic_atlas/tests/test_gallery_scale.py"
      - "experiments/semantic_atlas/pyproject.toml"
      - ".github/workflows/semantic-atlas-gallery-scale.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        working-directory: experiments/semantic_atlas
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: experiments/semantic_atlas/pyproject.toml
      - name: Detect preserved scale artifact
        id: preserved
        run: |
          if [ -f artifacts/gallery_scale_v1.json ] \
             && [ -f artifacts/gallery_scale_v1.png ] \
             && [ "$(find artifacts/embedding_cache_gallery_scale_v1 -name '*.npz' 2>/dev/null | wc -l)" -eq 4 ] \
             && [ "$(find artifacts/embedding_cache_gallery_scale_v1 -name '*.json' 2>/dev/null | wc -l)" -eq 4 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run unit tests
        run: pytest -q
      - name: Install model and analysis dependencies
        if: steps.preserved.outputs.exists != 'true'
        run: python -m pip install -e '.[models,analysis]'
      - name: Run frozen gallery-scale gate
        if: steps.preserved.outputs.exists != 'true'
        run: python scripts/run_gallery_scale.py
      - name: Upload exact observations
        if: steps.preserved.outputs.exists != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: semantic-atlas-gallery-scale-v1
          path: |
            experiments/semantic_atlas/artifacts/gallery_scale_v1.json
            experiments/semantic_atlas/artifacts/gallery_scale_v1.png
            experiments/semantic_atlas/artifacts/embedding_cache_gallery_scale_v1/**
          retention-days: 90
      - name: Persist exact observations on same-repository PR
        if: steps.preserved.outputs.exists != 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/semantic_atlas/artifacts/gallery_scale_v1.json
          git add experiments/semantic_atlas/artifacts/gallery_scale_v1.png
          git add experiments/semantic_atlas/artifacts/embedding_cache_gallery_scale_v1
          if ! git diff --cached --quiet; then
            git commit -m "data: persist gallery-scale v1 observations"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
