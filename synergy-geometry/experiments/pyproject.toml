[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "synergy-geometry-toy"
version = "0.1.0"
description = "Kill-first apparatus for the Synergy–Geometry experimental protocol"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/synergy_geometry"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
